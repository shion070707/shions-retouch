<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retouch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Retouch — 画像補正</title>
<style>
:root{--bg:#0f0f10;--panel:#19191b;--line:#2b2b30;--fg:#ededed;--sub:#9a9aa2;--acc:#ff4f8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:8px 10px}
header .title{font-weight:800;margin-right:auto;font-size:15px;letter-spacing:.02em}
button{font:inherit;color:inherit;background:#26262b;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.35;pointer-events:none}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:14px}
#view{max-width:100%;max-height:100%;display:block}
#empty{position:absolute;inset:14px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--sub);text-align:center;cursor:pointer;font-size:14px}
#empty b{color:var(--fg);font-size:16px}
#badge{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:11px;color:var(--sub);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;pointer-events:none;white-space:nowrap}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;max-height:40vh;overflow-y:auto;min-height:96px}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;border:none;background:none;border-radius:0;padding:12px 0 13px;color:var(--sub);font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:6.2em 1fr 2.8em;align-items:center;gap:8px;margin:4px 0}
.row label{font-size:13px}
.row output{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.hint{color:var(--sub);font-size:12px;margin:2px 0 8px;line-height:1.5}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px;font-size:16px}
dialog select{font:inherit;width:100%;background:#26262b;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px}
.field{margin:8px 0}
.field>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.dlgbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;font-size:14px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
</style>
</head>
<body>
<header>
  <span class="title">Retouch</span>
  <button id="bOpen">開く</button>
  <button id="bLast" disabled title="前回保存時の補正値を適用">前回設定</button>
  <button id="bCmp" disabled>押して比較</button>
  <button id="bSave" class="primary" disabled>保存</button>
  <input id="file" type="file" accept="image/*" hidden>
</header>

<div id="stage">
  <canvas id="view" width="1" height="1" hidden></canvas>
  <div id="empty"><b>タップして画像を開く</b>ドラッグ＆ドロップ・貼り付けもOK<br><small>画像は端末内だけで処理されます</small></div>
  <div id="badge" hidden></div>
</div>

<div id="panel"></div>
<nav id="tabs">
  <button data-m="crop" class="on">トリミング</button>
  <button data-m="height">脚長</button>
  <button data-m="color">色調</button>
  <button data-m="sharp">シャープ</button>
</nav>

<dialog id="dlg">
  <h3>保存</h3>
  <div class="field"><span>形式</span>
    <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
  <div class="field" id="qField"><span>画質 <output id="qOut">92</output></span>
    <input id="q" type="range" min="60" max="100" value="92"></div>
  <div class="field"><span>サイズ（長辺）</span>
    <select id="size"><option value="0">元のまま</option><option value="4096">最大 4096px（X推奨）</option><option value="2048">最大 2048px</option><option value="1080">最大 1080px</option></select></div>
  <div class="hint" id="outInfo"></div>
  <div class="dlgbtns">
    <button id="dCancel">閉じる</button>
    <button id="dShare" hidden>共有 / 写真に保存</button>
    <button id="dDl" class="primary">ダウンロード</button>
  </div>
</dialog>

<div id="busy">処理中…</div>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const PREV_MAX = 1280, SRC_MAX_PX = 16e6, LS_KEY = 'retouch.last.v1', LS_EXP = 'retouch.export.v1';
const ADJ_DEF = {exposure:0,brightness:0,contrast:0,highlights:0,shadows:0,saturation:0,vibrance:0,temp:0,tint:0};
const ADJ_META = [['exposure','露出'],['brightness','明るさ'],['contrast','コントラスト'],['highlights','ハイライト'],
  ['shadows','シャドウ'],['saturation','彩度'],['vibrance','自然な彩度'],['temp','色温度'],['tint','色かぶり']];
const ASPECTS = [['9:16','📱 スマホ縦 9:16'],['free','自由'],['orig','元比率'],['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['2:3','2:3'],['16:9','16:9']];
const STRETCH_MAX = 0.4;

const fresh = () => ({crop:{x:0,y:0,w:1,h:1}, aspect:'9:16', band:{t:0.55,b:0.97}, stretch:0, adj:{...ADJ_DEF}, sharp:{amount:0,radius:1}});
let S = fresh(), src = null, prev = null, processed = null, mode = 'crop', comparing = false, dirty = true, raf = 0, drag = null, fileBase = 'image';

/* ---------- helpers ---------- */
const mk = (w,h) => { const c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; };
const ctx = c => { const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; return x; };
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,1800); };

function scaleCanvas(c, k){
  const tw=Math.max(1,Math.round(c.width*k)), th=Math.max(1,Math.round(c.height*k));
  let cur=c, w=c.width, h=c.height;
  while (w/2 > tw && h/2 > th) { w=Math.round(w/2); h=Math.round(h/2); const t=mk(w,h); ctx(t).drawImage(cur,0,0,w,h); cur=t; }
  const out=mk(tw,th); ctx(out).drawImage(cur,0,0,tw,th); return out;
}

/* ---------- load ---------- */
async function loadFile(file){
  if (!file || !/^image\//.test(file.type)) return toast('画像ファイルを選んでください');
  fileBase = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1, Math.sqrt(SRC_MAX_PX/(w*h)));
    w=Math.round(w*k); h=Math.round(h*k);
    const c=mk(w,h); ctx(c).drawImage(img,0,0,w,h);
    S = fresh(); setSource(c); applyAspect();
    $('#empty').hidden = true; view.hidden = false;
    ['#bSave','#bCmp'].forEach(s=>$(s).disabled=false);
    $('#bLast').disabled = !lsGet(LS_KEY);
    setMode(mode);
  } catch { toast('読み込めませんでした'); }
  finally { URL.revokeObjectURL(url); }
}
function setSource(c){
  src = c;
  const k = Math.min(1, PREV_MAX/Math.max(c.width,c.height));
  prev = k<1 ? scaleCanvas(c,k) : c;
  dirty = true; schedule();
}

/* ---------- pipeline ---------- */
function bandGeo(hp){ // hp: cropped (pre-stretch) height
  const y0=Math.round(S.band.t*hp), y1=Math.round(S.band.b*hp), bh=y1-y0;
  const nb = (S.stretch>0.001 && bh>=2) ? Math.round(bh*(1+S.stretch)) : bh;
  return {y0,y1,bh,nb};
}
function process(base, k, rScale){
  const W=base.width, H=base.height, c=S.crop;
  const sx=Math.round(c.x*W), sy=Math.round(c.y*H), sw=Math.max(1,Math.round(c.w*W)), sh=Math.max(1,Math.round(c.h*H));
  let cv=mk(sw,sh); ctx(cv).drawImage(base,sx,sy,sw,sh,0,0,sw,sh);
  if (k < 0.999) cv = scaleCanvas(cv,k);
  cv = stretch(cv);
  pixels(cv, rScale);
  return cv;
}
function stretch(c){
  const w=c.width, h=c.height, {y0,y1,bh,nb}=bandGeo(h);
  if (nb===bh) return c;
  const out=mk(w, h-bh+nb), x=ctx(out);
  if (y0>0) x.drawImage(c,0,0,w,y0,0,0,w,y0);
  x.drawImage(c,0,y0,w,bh,0,y0,w,nb);
  if (h-y1>0) x.drawImage(c,0,y1,w,h-y1,0,y0+nb,w,h-y1);
  return out;
}
function pixels(cv, rScale){
  const a=S.adj, sp=S.sharp;
  const hasAdj=Object.keys(ADJ_DEF).some(k=>a[k]!==0), hasSharp=sp.amount>0;
  if (!hasAdj && !hasSharp) return;
  const x=ctx(cv), id=x.getImageData(0,0,cv.width,cv.height), d=id.data;
  if (hasAdj) adjust(d,a);
  if (hasSharp) sharpen(d,cv.width,cv.height,sp.amount/100, clamp(Math.round(sp.radius*rScale),1,12));
  x.putImageData(id,0,0);
}
function adjust(d,a){
  const ev=Math.pow(2,a.exposure/100*1.5), br=a.brightness*0.6, ct=a.contrast>=0?1+a.contrast/100:1+a.contrast/100*0.8;
  const lut=new Float32Array(256);
  for (let i=0;i<256;i++) lut[i]=(i*ev+br-128)*ct+128;
  const hi=a.highlights*0.7, shd=a.shadows*0.7, tr=a.temp*0.3, tg=-a.tint*0.3;
  const sat=1+a.saturation/100, vib=a.vibrance/100, doHS=hi||shd, doSat=sat!==1||vib!==0;
  for (let i=0;i<d.length;i+=4){
    let r=lut[d[i]], g=lut[d[i+1]], b=lut[d[i+2]];
    if (doHS){
      const L=clamp((0.299*r+0.587*g+0.114*b)/255,0,1);
      let t=clamp(1-L/0.6,0,1); const ws=t*t*(3-2*t);
      t=clamp((L-0.4)/0.6,0,1); const wh=t*t*(3-2*t);
      const off=shd*ws+hi*wh; r+=off; g+=off; b+=off;
    }
    r+=tr; b-=tr; g+=tg;
    if (doSat){
      const L=0.299*r+0.587*g+0.114*b; let f=sat;
      if (vib){ const mx=Math.max(r,g,b), mn=Math.min(r,g,b); f*=1+vib*(1-clamp((mx-mn)/255,0,1)); }
      r=L+(r-L)*f; g=L+(g-L)*f; b=L+(b-L)*f;
    }
    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
}
function boxBlur(s,w,h,r){
  const tmp=new Uint8ClampedArray(w*h*3), out=new Uint8ClampedArray(w*h*3), inv=1/(2*r+1);
  for (let y=0;y<h;y++){ const ro=y*w;
    for (let c=0;c<3;c++){ let sum=0;
      for (let k=-r;k<=r;k++) sum+=s[(ro+clamp(k,0,w-1))*4+c];
      for (let x=0;x<w;x++){ tmp[(ro+x)*3+c]=sum*inv;
        const xa=x+r+1, xs=x-r; sum+=s[(ro+(xa>w-1?w-1:xa))*4+c]-s[(ro+(xs<0?0:xs))*4+c]; } } }
  for (let x=0;x<w;x++){
    for (let c=0;c<3;c++){ let sum=0;
      for (let k=-r;k<=r;k++) sum+=tmp[(clamp(k,0,h-1)*w+x)*3+c];
      for (let y=0;y<h;y++){ out[(y*w+x)*3+c]=sum*inv;
        const ya=y+r+1, ys=y-r; sum+=tmp[((ya>h-1?h-1:ya)*w+x)*3+c]-tmp[((ys<0?0:ys)*w+x)*3+c]; } } }
  return out;
}
function sharpen(d,w,h,amt,r){
  const bl=boxBlur(d,w,h,r);
  for (let i=0,j=0;i<d.length;i+=4,j+=3){
    for (let c=0;c<3;c++){ const v=d[i+c]; d[i+c]=v+(v-bl[j+c])*amt; }
  }
}

/* ---------- render ---------- */
function schedule(re){ if (re) dirty=true; if (!raf) raf=requestAnimationFrame(draw); }
function blit(c){ if (view.width!==c.width||view.height!==c.height){ view.width=c.width; view.height=c.height; } vctx.drawImage(c,0,0); }
const unit = () => { const r=view.getBoundingClientRect(); return r.width ? view.width/r.width : 1; };
function draw(){
  raf=0; if (!prev) return;
  if (comparing){ blit(prev); layoutView(); badge(); return; }
  if (mode==='crop'){ blit(prev); layoutView(); cropOverlay(); badge(); return; }
  if (dirty){ processed=process(prev,1,1); dirty=false; }
  blit(processed);
  layoutView();
  if (mode==='height') bandOverlay();
  badge();
}
/* 脚長モード：横幅を固定し、伸ばした分だけ下に伸びるように表示 */
function layoutView(){
  const st=view.style, sg=stage.style;
  if (mode!=='height' || comparing){ st.width=st.height=st.marginTop=''; sg.alignItems=''; return; }
  const cs=getComputedStyle(stage);
  const aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const wp=processed.width, hp=Math.max(1,Math.round(S.crop.h*prev.height));
  const k=Math.min(aw/wp, ah/(hp*(1+STRETCH_MAX)));
  st.width=(wp*k)+'px'; st.height=(view.height*k)+'px';
  st.marginTop=Math.max(0,(ah-hp*(1+STRETCH_MAX)*k)/2)+'px';
  sg.alignItems='flex-start';
}
function outSize(){
  const sw=Math.round(S.crop.w*src.width), sh=Math.round(S.crop.h*src.height), g=bandGeo(sh);
  return [sw, sh-g.bh+g.nb];
}
function badge(){
  const b=$('#badge'); if (!src){ b.hidden=true; return; }
  const [w,h]=outSize(); b.hidden=false;
  b.textContent = comparing ? '元画像' : `${src.width}×${src.height} → ${w}×${h}`;
}
function cropOverlay(){
  const W=view.width,H=view.height,c=S.crop,x=c.x*W,y=c.y*H,w=c.w*W,h=c.h*H,u=unit(), x2=vctx;
  x2.save();
  x2.fillStyle='rgba(0,0,0,.58)'; x2.beginPath(); x2.rect(0,0,W,H); x2.rect(x,y,w,h); x2.fill('evenodd');
  x2.strokeStyle='rgba(255,255,255,.45)'; x2.lineWidth=u; x2.beginPath();
  for (let i=1;i<3;i++){ x2.moveTo(x+w*i/3,y); x2.lineTo(x+w*i/3,y+h); x2.moveTo(x,y+h*i/3); x2.lineTo(x+w,y+h*i/3); }
  x2.stroke();
  x2.strokeStyle='#fff'; x2.lineWidth=1.5*u; x2.strokeRect(x,y,w,h);
  const L=Math.min(20*u,w/3,h/3); x2.lineWidth=4*u; x2.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy])=>{ x2.moveTo(cx+dx*L,cy); x2.lineTo(cx,cy); x2.lineTo(cx,cy+dy*L); });
  x2.stroke(); x2.restore();
}
function bandOverlay(){
  const W=view.width,u=unit(),hp=Math.max(1,Math.round(S.crop.h*prev.height)),{y0,nb}=bandGeo(hp), y1=y0+nb, x2=vctx;
  x2.save();
  x2.fillStyle='rgba(255,79,139,.13)'; x2.fillRect(0,y0,W,nb);
  x2.strokeStyle='#ff4f8b'; x2.lineWidth=2*u; x2.setLineDash([8*u,6*u]);
  x2.beginPath(); x2.moveTo(0,y0); x2.lineTo(W,y0); x2.moveTo(0,y1); x2.lineTo(W,y1); x2.stroke(); x2.setLineDash([]);
  [y0,y1].forEach(yy=>{ x2.beginPath(); x2.arc(W/2,yy,11*u,0,Math.PI*2); x2.fillStyle='#fff'; x2.fill(); x2.lineWidth=3*u; x2.stroke(); });
  x2.restore();
}

/* ---------- pointer ---------- */
const pt = e => { const r=view.getBoundingClientRect(); return {x:(e.clientX-r.left)*view.width/r.width, y:(e.clientY-r.top)*view.height/r.height}; };
function aspectVal(){
  if (S.aspect==='free') return 0;
  if (S.aspect==='orig') return src.width/src.height;
  const [a,b]=S.aspect.split(':').map(Number); return a/b;
}
function applyAspect(){
  const A=aspectVal(); if (!A) return;
  const W=prev.width,H=prev.height; let w=W,h=w/A; if (h>H){ h=H; w=h*A; }
  S.crop={x:(W-w)/2/W,y:(H-h)/2/H,w:w/W,h:h/H};
}
function cropHit(p,u){
  const W=view.width,H=view.height,c=S.crop,x0=c.x*W,y0=c.y*H,x1=x0+c.w*W,y1=y0+c.h*H,tol=28*u;
  const cs=[[x0,y0,-1,-1,x1,y1],[x1,y0,1,-1,x0,y1],[x0,y1,-1,1,x1,y0],[x1,y1,1,1,x0,y0]];
  let best=null,bd=tol;
  cs.forEach(([cx,cy,dx,dy,ax,ay])=>{ const d=Math.hypot(p.x-cx,p.y-cy); if (d<bd){ bd=d; best={t:'resize',dx,dy,ax,ay}; } });
  if (best) return best;
  if (p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1) return {t:'move',ox:p.x-x0,oy:p.y-y0};
  return null;
}
function cropDrag(p,u){
  const W=view.width,H=view.height;
  if (drag.t==='move'){
    const w=S.crop.w*W,h=S.crop.h*H;
    S.crop.x=clamp(p.x-drag.ox,0,W-w)/W; S.crop.y=clamp(p.y-drag.oy,0,H-h)/H; return;
  }
  const {dx,dy,ax,ay}=drag, A=aspectVal(), mn=30*u;
  let w=Math.max(mn,(p.x-ax)*dx), h=Math.max(mn,(p.y-ay)*dy);
  const maxW=dx>0?W-ax:ax, maxH=dy>0?H-ay:ay;
  if (A){ if (w/h>A) h=w/A; else w=h*A; if (w>maxW){ w=maxW; h=w/A; } if (h>maxH){ h=maxH; w=h*A; } }
  else { w=Math.min(w,maxW); h=Math.min(h,maxH); }
  const x=dx>0?ax:ax-w, y=dy>0?ay:ay-h;
  S.crop={x:x/W,y:y/H,w:w/W,h:h/H};
}
function bandHit(p,u){
  const hp=Math.max(1,Math.round(S.crop.h*prev.height)),{y0,nb}=bandGeo(hp),tol=30*u;
  const d0=Math.abs(p.y-y0), d1=Math.abs(p.y-(y0+nb));
  if (Math.min(d0,d1)<tol) return {t: d0<=d1?'top':'bot', hp};
  if (p.y>y0&&p.y<y0+nb) return {t:'band',hp,sy:p.y,t0:S.band.t,b0:S.band.b};
  return null;
}
function bandDrag(p){
  const hp=drag.hp, s=S.stretch>0.001?S.stretch:0, gap=0.03;
  if (drag.t==='top') S.band.t=clamp(p.y/hp,0,S.band.b-gap);
  else if (drag.t==='bot'){ const y0=S.band.t*hp; S.band.b=clamp((y0+(p.y-y0)/(1+s))/hp,S.band.t+gap,1); }
  else { const len=drag.b0-drag.t0; let t=drag.t0+(p.y-drag.sy)/hp; t=clamp(t,0,1-len); S.band.t=t; S.band.b=t+len; }
}
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{
  if (!prev) { $('#file').click(); return; }
  if (comparing) return;
  const p=pt(e), u=unit();
  drag = mode==='crop' ? cropHit(p,u) : mode==='height' ? bandHit(p,u) : null;
  if (drag){ stage.setPointerCapture(e.pointerId); e.preventDefault(); }
});
stage.addEventListener('pointermove',e=>{
  if (!drag) return; const p=pt(e);
  if (mode==='crop'){ cropDrag(p,unit()); schedule(true); } else { bandDrag(p); schedule(true); }
});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,()=>{ if (drag){ drag=null; schedule(true); } }));

/* ---------- panel ---------- */
function slider(key,label,min,max,val,step=1){
  return `<div class="row"><label data-reset="${key}">${label}</label><input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${val}</output></div>`;
}
function renderPanel(){
  const P=$('#panel');
  if (mode==='crop'){
    P.innerHTML = `<div class="chips">${ASPECTS.map(([k,l])=>`<button class="chip${S.aspect===k?' on':''}" data-asp="${k}">${l}</button>`).join('')}</div>
      <div class="btns"><button data-act="rotL">↺ 左回転</button><button data-act="rotR">↻ 右回転</button><button data-act="flip">⇋ 反転</button><button data-act="cropReset">リセット</button></div>`;
  } else if (mode==='height'){
    P.innerHTML = `<div class="hint">ピンクの2本線をドラッグして伸ばす範囲（脚など）を指定。帯の中をドラッグすると範囲ごと移動します。</div>
      ${slider('stretch','伸ばす',0,40,Math.round(S.stretch*100))}
      <div class="btns"><button data-act="bandReset">範囲リセット</button></div>`;
  } else if (mode==='color'){
    P.innerHTML = `<div class="hint">ラベルをダブルタップでその項目を0に戻す</div>
      ${ADJ_META.map(([k,l])=>slider(k,l,-100,100,S.adj[k])).join('')}
      <div class="btns" style="margin-top:6px"><button data-act="adjReset">色調をすべてリセット</button></div>`;
  } else {
    P.innerHTML = `${slider('amount','強さ',0,200,S.sharp.amount)}${slider('radius','半径',1,3,S.sharp.radius)}
      <div class="hint">プレビューは縮小表示です。保存時は解像度に合わせて半径を自動調整します。</div>`;
  }
}
function setVal(k,v){
  if (k==='stretch') S.stretch=v/100;
  else if (k==='amount'||k==='radius') S.sharp[k]=v;
  else S.adj[k]=v;
}
$('#panel').addEventListener('input',e=>{
  const k=e.target.dataset.k; if (!k) return;
  const v=+e.target.value; setVal(k,v); e.target.nextElementSibling.textContent=v; schedule(true);
});
$('#panel').addEventListener('dblclick',e=>{
  const k=e.target.dataset.reset; if (!k) return;
  const def = k==='radius'?1:0; setVal(k,def); renderPanel(); schedule(true);
});
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button'); if (!b||!src) return;
  if (b.dataset.asp){ S.aspect=b.dataset.asp; if (S.aspect==='free') S.crop={x:0,y:0,w:1,h:1}; else applyAspect(); renderPanel(); schedule(true); return; }
  const a=b.dataset.act;
  if (a==='rotL'||a==='rotR') rotate(a==='rotL'?-1:1);
  else if (a==='flip') flip();
  else if (a==='cropReset'){ S.aspect='free'; S.crop={x:0,y:0,w:1,h:1}; }
  else if (a==='bandReset'){ S.band={t:0.55,b:0.97}; }
  else if (a==='adjReset'){ S.adj={...ADJ_DEF}; }
  renderPanel(); schedule(true);
});
function rotate(dir){
  const c=mk(src.height,src.width), x=ctx(c);
  x.translate(c.width/2,c.height/2); x.rotate(dir*Math.PI/2); x.drawImage(src,-src.width/2,-src.height/2);
  setSource(c); S.crop={x:0,y:0,w:1,h:1}; applyAspect();
}
function flip(){
  const c=mk(src.width,src.height), x=ctx(c); x.translate(c.width,0); x.scale(-1,1); x.drawImage(src,0,0);
  setSource(c); S.crop.x=1-S.crop.x-S.crop.w;
}
function setMode(m){
  mode=m; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  renderPanel(); schedule(false);
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if (b) setMode(b.dataset.m); });

/* ---------- header ---------- */
$('#bOpen').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ loadFile(e.target.files[0]); e.target.value=''; };
$('#empty').onclick=()=>$('#file').click();
const cmp=$('#bCmp');
const cmpOn=e=>{ if (!prev) return; e.preventDefault(); comparing=true; schedule(false); };
const cmpOff=()=>{ if (comparing){ comparing=false; schedule(false); } };
cmp.addEventListener('pointerdown',cmpOn); ['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,cmpOff));
cmp.addEventListener('contextmenu',e=>e.preventDefault());
$('#bLast').onclick=()=>{
  const L=lsGet(LS_KEY); if (!L||!src) return;
  S.adj={...ADJ_DEF,...L.adj}; S.sharp={...S.sharp,...L.sharp}; S.stretch=L.stretch||0;
  if (L.band) S.band=L.band;
  if (L.aspect){ S.aspect=L.aspect; if (S.aspect==='free') S.crop={x:0,y:0,w:1,h:1}; else applyAspect(); }
  renderPanel(); schedule(true); toast('前回の設定を適用しました');
};

/* ---------- save ---------- */
const dlg=$('#dlg');
function exportScale(){
  const [w,h]=outSize(), max=+$('#size').value;
  let k=1; if (max) k=Math.min(1,max/Math.max(w,h));
  k=Math.min(k,Math.sqrt(SRC_MAX_PX/(w*h)));
  return {k,w:Math.round(w*k),h:Math.round(h*k)};
}
function updInfo(){
  $('#qField').style.display = $('#fmt').value==='image/png' ? 'none' : '';
  $('#qOut').textContent=$('#q').value;
  const {w,h}=exportScale(); $('#outInfo').textContent=`出力サイズ：${w} × ${h}px`;
}
['#fmt','#q','#size'].forEach(s=>$(s).addEventListener('input',updInfo));
$('#bSave').onclick=()=>{
  const E=lsGet(LS_EXP); if (E){ $('#fmt').value=E.fmt; $('#q').value=E.q; $('#size').value=E.size; }
  let canShare=false;
  try { canShare = !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'],{type:'image/png'})],'t.png',{type:'image/png'})]})); } catch {}
  $('#dShare').hidden=!canShare;
  updInfo(); dlg.showModal();
};
$('#dCancel').onclick=()=>dlg.close();
async function makeBlob(){
  $('#busy').style.display='flex';
  await new Promise(r=>setTimeout(r,40));
  try {
    const {k}=exportScale();
    const rScale = k*src.width/prev.width;
    const out=process(src,k,rScale);
    const fmt=$('#fmt').value, q=+$('#q').value/100;
    const blob=await new Promise(r=>out.toBlob(r,fmt,q));
    if (!blob) throw 0;
    lsSet(LS_KEY,{adj:S.adj,sharp:S.sharp,stretch:S.stretch,band:S.band,aspect:S.aspect});
    lsSet(LS_EXP,{fmt,q:$('#q').value,size:$('#size').value});
    $('#bLast').disabled=false;
    const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const name=`${fileBase}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
    return {blob,name};
  } catch { toast('保存に失敗しました（サイズを小さくしてみてください）'); return null; }
  finally { $('#busy').style.display='none'; }
}
$('#dDl').onclick=async()=>{
  const r=await makeBlob(); if (!r) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob); a.download=r.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dlg.close(); toast('保存しました');
};
$('#dShare').onclick=async()=>{
  const r=await makeBlob(); if (!r) return;
  try { await navigator.share({files:[new File([r.blob],r.name,{type:r.blob.type})]}); dlg.close(); }
  catch(e){ if (e && e.name!=='AbortError') toast('共有できませんでした'); }
};

/* ---------- drop / paste ---------- */
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('paste',e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });
window.addEventListener('resize',()=>schedule(false));

renderPanel();
})();
</script>
</body>
