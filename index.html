<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shion's Retouch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Shion's Retouch</title>
<style>
:root{--bg:#0f0f10;--panel:#19191b;--line:#2b2b30;--fg:#ededed;--sub:#9a9aa2;--acc:#ff4f8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 10px}
header .title{font-weight:800;margin-right:auto;font-size:15px;letter-spacing:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
header button{white-space:nowrap;flex:none;padding:8px 8px}
#bHUndo,#bHRedo{padding:8px 7px}
button{font:inherit;color:inherit;background:#26262b;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.35;pointer-events:none}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:4px}
#view{max-width:100%;max-height:100%;display:block}
#empty{position:absolute;inset:10px 10px 200px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--sub);text-align:center;cursor:pointer;font-size:14px}
#empty b{color:var(--fg);font-size:16px}
#bFit{position:absolute;right:8px;top:6px;z-index:3;font-size:12px;padding:6px 10px;background:rgba(30,30,34,.8)}
#badge{position:absolute;left:50%;top:4px;z-index:2;transform:translateX(-50%);font-size:11px;color:var(--sub);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;pointer-events:none;white-space:nowrap}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(16,16,18,.68);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid rgba(255,255,255,.08);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#grab{height:16px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:ns-resize}
#grab::before{content:'';width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
#grab.nograb{height:6px;cursor:default}#grab.nograb::before{display:none}
#panel{padding:2px 14px 8px;max-height:var(--ph,96px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transition:max-height .18s ease}
#panel.drag{transition:none}
#dock button:not(.primary):not(.chip.on):not(.ok2){background:rgba(40,40,46,.75)}
nav{display:flex;border-top:1px solid rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none;height:54px}
nav::-webkit-scrollbar{display:none}
#dock nav button{flex:1 0 62px;border:none;background:none;border-radius:0;padding:6px 0 7px;color:var(--fg);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button .ic{font-size:18px;line-height:1}
nav button .ok{position:absolute;top:4px;left:calc(50% + 8px);width:16px;height:16px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;line-height:16px;font-weight:800;display:none}
nav button.done .ok{display:block}
#actbar{display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.08);padding:0 10px;height:54px;box-sizing:border-box}
#actbar button{font-size:15px;padding:7px 12px;min-width:44px}
#actbar .name{flex:1;text-align:center;font-weight:700;font-size:14px}
#actbar .name small{display:block;color:var(--acc);font-weight:600;font-size:11px}
#actbar .ok2{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--sub)}
.summary .tag{background:rgba(255,79,139,.15);color:var(--acc);border-radius:99px;padding:3px 9px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:6.2em 1fr 2.8em;align-items:center;gap:8px;margin:4px 0}
.row label{font-size:13px}
.row output{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.scale{display:grid;grid-template-columns:6.2em 1fr 2.8em;gap:8px;margin:-6px 0 6px;font-size:10px;color:var(--sub)}
.scale span:nth-child(1){grid-column:2;grid-row:1;justify-self:start}.scale span:nth-child(2){grid-column:2;grid-row:1;justify-self:center}.scale span:nth-child(3){grid-column:2;grid-row:1;justify-self:end}
.hint{color:var(--sub);font-size:12px;margin:2px 0 8px;line-height:1.5}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px;font-size:16px}
dialog select{font:inherit;width:100%;background:#26262b;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px}
.field{margin:8px 0}
.field>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.dlgbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;font-size:14px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
</style>
</head>
<body>
<header>
  <span class="title">Shion's Retouch</span>
  <button id="bOpen">開く</button>
  <button id="bHUndo" disabled title="戻る">↶</button>
  <button id="bHRedo" disabled title="進む">↷</button>
  <button id="bCmp" disabled title="押している間、元画像を表示">比較</button>
  <button id="bSave" class="primary" disabled>保存</button>
  <input id="file" type="file" accept="image/*" hidden>
</header>

<div id="stage">
  <canvas id="view" width="1" height="1" hidden></canvas>
  <div id="empty"><b>タップして画像を開く</b>ドラッグ＆ドロップ・貼り付けもOK<br><small>画像は端末内だけで処理されます</small></div>
  <div id="badge" hidden></div>
  <button id="bFit" hidden title="表示を元に戻す">⤢ 全体表示</button>
</div>

<div id="dock">
<div id="grab"></div>
<div id="panel"></div>
<nav id="tabs">
  <button data-m="crop"><span class="ic">⛶</span>トリミング<span class="ok">✓</span></button>
  <button data-m="height"><span class="ic">↕</span>高さ<span class="ok">✓</span></button>
  <button data-m="color"><span class="ic">◐</span>色調<span class="ok">✓</span></button>
  <button data-m="sharp"><span class="ic">◇</span>シャープ<span class="ok">✓</span></button>
  <button data-m="erase"><span class="ic">✎</span>消しゴム<span class="ok">✓</span></button>
  <button data-m="mosaic"><span class="ic">▦</span>モザイク<span class="ok">✓</span></button>
  <button data-m="blur"><span class="ic">◎</span>背景ぼかし<span class="ok">✓</span></button>
</nav>
<div id="actbar" hidden>
  <button id="bCancel" title="キャンセル">✕</button>
  <button id="bLUndo" title="戻る" disabled>↶</button>
  <div class="name"><span id="actName"></span><small>編集中</small></div>
  <button id="bLRedo" title="進む" disabled>↷</button>
  <button id="bDone" class="ok2" title="完了">✓ 完了</button>
</div>
</div>

<dialog id="dlg">
  <h3>保存</h3>
  <div class="field"><span>形式</span>
    <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
  <div class="field" id="qField"><span>画質 <output id="qOut">92</output></span>
    <input id="q" type="range" min="60" max="100" value="92"></div>
  <div class="field"><span>サイズ（長辺）</span>
    <select id="size"><option value="0">元のまま</option><option value="4096">最大 4096px（X推奨）</option><option value="2048">最大 2048px</option><option value="1080">最大 1080px</option></select></div>
  <div class="hint" id="outInfo"></div>
  <div class="dlgbtns">
    <button id="dCancel">閉じる</button>
    <button id="dShare" hidden>共有 / 写真に保存</button>
    <button id="dDl" class="primary">ダウンロード</button>
  </div>
</dialog>

<div id="busy">処理中…</div>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const PREV_MAX = 1280, SRC_MAX_PX = 16e6, LS_KEY = 'retouch.last.v1', LS_EXP = 'retouch.export.v1';
const ADJ_DEF = {exposure:0,brightness:0,contrast:0,highlights:0,shadows:0,saturation:0,vibrance:0,temp:0,tint:0};
const ADJ_META = [['exposure','露出'],['brightness','明るさ'],['contrast','コントラスト'],['highlights','ハイライト'],
  ['shadows','シャドウ'],['saturation','彩度'],['vibrance','自然な彩度'],['temp','色温度'],['tint','色かぶり']];
const ASPECTS = [['9:16','📱 スマホ縦 9:16'],['free','自由'],['orig','元比率'],['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['2:3','2:3'],['16:9','16:9']];
const STRETCH_MAX = 0.4;

const fresh = () => ({crop:{x:0,y:0,w:1,h:1}, aspect:'9:16', band:{t:0.55,b:0.97}, stretch:0, angle:0, bt:{str:16,fe:4}, adj:{...ADJ_DEF}, sharp:{amount:0,radius:1}});
const TOOL_NAMES={crop:'トリミング',height:'高さ',color:'色調',sharp:'シャープ',erase:'消しゴム',mosaic:'モザイク',blur:'背景ぼかし',last:'前回設定'};
const BRUSH_MODES=new Set(['erase','mosaic','blur']);
const MOS_TYPES=[['pixel','四角'],['dot','ドット'],['blur','すりガラス'],['black','黒塗り']];
let mos={type:'pixel', size:12};
let blurMask=null, blurAuto=null, blurMaskSrc=null, blurState='', blurDirty=true, blurPrev=null, blurOv=null, blurredCache=null, blurBrush='add', showMask=true, segmenter=null;
const clone=o=>JSON.parse(JSON.stringify(o));
let hist=[], hpos=0, sess=null;
let procKind='', Z={z:1,tx:0,ty:0}, brush=16, stroke=null, cursor=null, pointers=new Map(), pinch=null;
let S = fresh(), src = null, prev = null, processed = null, mode = 'home', comparing = false, dirty = true, raf = 0, drag = null, fileBase = 'image';

/* ---------- helpers ---------- */
const mk = (w,h) => { const c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; };
const ctx = c => { const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; return x; };
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,1800); };

function scaleCanvas(c, k){
  const tw=Math.max(1,Math.round(c.width*k)), th=Math.max(1,Math.round(c.height*k));
  let cur=c, w=c.width, h=c.height;
  while (w/2 > tw && h/2 > th) { w=Math.round(w/2); h=Math.round(h/2); const t=mk(w,h); ctx(t).drawImage(cur,0,0,w,h); cur=t; }
  const out=mk(tw,th); ctx(out).drawImage(cur,0,0,tw,th); return out;
}

/* ---------- load ---------- */
async function loadFile(file){
  if (!file || !/^image\//.test(file.type)) return toast('画像ファイルを選んでください');
  fileBase = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1, Math.sqrt(SRC_MAX_PX/(w*h)));
    w=Math.round(w*k); h=Math.round(h*k);
    const c=mk(w,h); ctx(c).drawImage(img,0,0,w,h);
    S = fresh(); used={}; hist=[]; hpos=0; sess=null; blurMask=null; blurPrev=null; blurOv=null; blurredCache=null; resetZoom(); setSource(c); applyAspect();
    $('#empty').hidden = true; view.hidden = false;
    ['#bSave','#bCmp'].forEach(s=>$(s).disabled=false);
    setMode('home');
  } catch { toast('読み込めませんでした'); }
  finally { URL.revokeObjectURL(url); }
}
function setSource(c){
  src = c;
  const k = Math.min(1, PREV_MAX/Math.max(c.width,c.height));
  prev = k<1 ? scaleCanvas(c,k) : c;
  dirty = true; schedule();
}

/* ---------- pipeline ---------- */
function bandGeo(hp){ // hp: cropped (pre-stretch) height
  const y0=Math.round(S.band.t*hp), y1=Math.round(S.band.b*hp), bh=y1-y0;
  const cs=Math.cos((S.angle||0)*Math.PI/180);
  const nb = (Math.abs(S.stretch)>0.001 && bh>=2) ? bh+Math.round(bh*S.stretch*cs) : bh;
  return {y0,y1,bh,nb};
}
/* 帯の向き（角度付き）：n=伸ばす方向, O=上の線の中心, L=帯の長さ */
function bandFrame(w,h){
  const th=(S.angle||0)*Math.PI/180, nx=Math.sin(th), ny=Math.cos(th);
  return {nx,ny,ox:w/2,oy:S.band.t*h,L:(S.band.b-S.band.t)*h,s:Math.abs(S.stretch)>0.001?S.stretch:0};
}
function process(base, k, rScale, noStretch){
  const W=base.width, H=base.height, c=S.crop;
  const sx=Math.round(c.x*W), sy=Math.round(c.y*H), sw=Math.max(1,Math.round(c.w*W)), sh=Math.max(1,Math.round(c.h*H));
  let cv=mk(sw,sh); ctx(cv).drawImage(base,sx,sy,sw,sh,0,0,sw,sh);
  if (k < 0.999) cv = scaleCanvas(cv,k);
  if (!noStretch) cv = stretch(cv);
  pixels(cv, rScale);
  return cv;
}
function stretch(c){
  const w=c.width, h=c.height, {y0,y1,bh,nb}=bandGeo(h);
  if (nb===bh) return c;
  if (S.angle) return stretchAngled(c, h-bh+nb);
  const out=mk(w, h-bh+nb), x=ctx(out);
  if (y0>0) x.drawImage(c,0,0,w,y0,0,0,w,y0);
  x.drawImage(c,0,y0,w,bh,0,y0,w,nb);
  if (h-y1>0) x.drawImage(c,0,y1,w,h-y1,0,y0+nb,w,h-y1);
  return out;
}
function stretchAngled(c, H){
  const w=c.width, h=c.height, F=bandFrame(w,h), {nx,ny,ox,oy,L,s}=F;
  const sd=ctx(c).getImageData(0,0,w,h).data, out=new ImageData(w,H), od=out.data;
  const Ls=L*(1+s), shift=L*s, k=s/(1+s);
  for (let y=0;y<H;y++){
    for (let x=0;x<w;x++){
      const v=(x-ox)*nx+(y-oy)*ny; let sx=x, sy=y;
      if (v>0){ const back = v<Ls ? v*k : shift; sx=x-nx*back; sy=y-ny*back; }
      sx=sx<0?0:sx>w-1?w-1:sx; sy=sy<0?0:sy>h-1?h-1:sy;
      const ix=sx|0, iy=sy|0, fx=sx-ix, fy=sy-iy, ix1=ix<w-1?ix+1:ix, iy1=iy<h-1?iy+1:iy;
      const a=(iy*w+ix)*4, b=(iy*w+ix1)*4, c2=(iy1*w+ix)*4, d=(iy1*w+ix1)*4, o=(y*w+x)*4;
      for (let ch=0;ch<4;ch++){
        const top=sd[a+ch]+(sd[b+ch]-sd[a+ch])*fx, bot=sd[c2+ch]+(sd[d+ch]-sd[c2+ch])*fx;
        od[o+ch]=top+(bot-top)*fy;
      }
    }
  }
  const oc=mk(w,H); ctx(oc).putImageData(out,0,0); return oc;
}
function pixels(cv, rScale){
  const a=S.adj, sp=S.sharp;
  const hasAdj=Object.keys(ADJ_DEF).some(k=>a[k]!==0), hasSharp=sp.amount>0;
  if (!hasAdj && !hasSharp) return;
  const x=ctx(cv), id=x.getImageData(0,0,cv.width,cv.height), d=id.data;
  if (hasAdj) adjust(d,a);
  if (hasSharp) sharpen(d,cv.width,cv.height,sp.amount/100, clamp(Math.round(sp.radius*rScale),1,12));
  x.putImageData(id,0,0);
}
function adjust(d,a){
  const ev=Math.pow(2,a.exposure/100*1.5), br=a.brightness*0.6, ct=a.contrast>=0?1+a.contrast/100:1+a.contrast/100*0.8;
  const lut=new Float32Array(256);
  for (let i=0;i<256;i++) lut[i]=(i*ev+br-128)*ct+128;
  const hi=a.highlights*0.7, shd=a.shadows*0.7, tr=a.temp*0.3, tg=-a.tint*0.3;
  const sat=1+a.saturation/100, vib=a.vibrance/100, doHS=hi||shd, doSat=sat!==1||vib!==0;
  for (let i=0;i<d.length;i+=4){
    let r=lut[d[i]], g=lut[d[i+1]], b=lut[d[i+2]];
    if (doHS){
      const L=clamp((0.299*r+0.587*g+0.114*b)/255,0,1);
      let t=clamp(1-L/0.6,0,1); const ws=t*t*(3-2*t);
      t=clamp((L-0.4)/0.6,0,1); const wh=t*t*(3-2*t);
      const off=shd*ws+hi*wh; r+=off; g+=off; b+=off;
    }
    r+=tr; b-=tr; g+=tg;
    if (doSat){
      const L=0.299*r+0.587*g+0.114*b; let f=sat;
      if (vib){ const mx=Math.max(r,g,b), mn=Math.min(r,g,b); f*=1+vib*(1-clamp((mx-mn)/255,0,1)); }
      r=L+(r-L)*f; g=L+(g-L)*f; b=L+(b-L)*f;
    }
    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
}
function boxBlur(s,w,h,r){
  const tmp=new Uint8ClampedArray(w*h*3), out=new Uint8ClampedArray(w*h*3), inv=1/(2*r+1);
  for (let y=0;y<h;y++){ const ro=y*w;
    for (let c=0;c<3;c++){ let sum=0;
      for (let k=-r;k<=r;k++) sum+=s[(ro+clamp(k,0,w-1))*4+c];
      for (let x=0;x<w;x++){ tmp[(ro+x)*3+c]=sum*inv;
        const xa=x+r+1, xs=x-r; sum+=s[(ro+(xa>w-1?w-1:xa))*4+c]-s[(ro+(xs<0?0:xs))*4+c]; } } }
  for (let x=0;x<w;x++){
    for (let c=0;c<3;c++){ let sum=0;
      for (let k=-r;k<=r;k++) sum+=tmp[(clamp(k,0,h-1)*w+x)*3+c];
      for (let y=0;y<h;y++){ out[(y*w+x)*3+c]=sum*inv;
        const ya=y+r+1, ys=y-r; sum+=tmp[((ya>h-1?h-1:ya)*w+x)*3+c]-tmp[((ys<0?0:ys)*w+x)*3+c]; } } }
  return out;
}
function sharpen(d,w,h,amt,r){
  const bl=boxBlur(d,w,h,r);
  for (let i=0,j=0;i<d.length;i+=4,j+=3){
    for (let c=0;c<3;c++){ const v=d[i+c]; d[i+c]=v+(v-bl[j+c])*amt; }
  }
}

/* ---------- render ---------- */
function schedule(re){ if (re) dirty=true; if (!raf) raf=requestAnimationFrame(draw); }
function blit(c){ if (view.width!==c.width||view.height!==c.height){ view.width=c.width; view.height=c.height; } vctx.drawImage(c,0,0); }
const unit = () => { const r=view.getBoundingClientRect(); return r.width ? view.width/r.width : 1; };
function draw(){
  raf=0; if (!prev) return;
  if (comparing){ blit(prev); layoutView(); badge(); return; }

function flip(){
  const c=mk(src.width,src.height), x=ctx(c); x.translate(c.width,0); x.scale(-1,1); x.drawImage(src,0,0);
  setSource(c); S.crop.x=1-S.crop.x-S.crop.w;
}
function setMode(m){
  mode=m; panelOpen=false; resetZoom(); pan1=null; stroke=null; cursor=null; pinch=null; pointers.clear();
  if (m!=='home' && !sess) sess={tool:m, ops:[], redo:[], base:clone(S), baseSrc:src};
  $('#tabs').hidden = m!=='home'; $('#actbar').hidden = m==='home';
  if (m!=='home') $('#actName').textContent=TOOL_NAMES[m];
  renderPanel(); updateBars(); schedule(false);
  if (m==='blur'){ blurDirty=true; if (!blurMask || blurMaskSrc!==src) detectSubject(); else { blurState='ok'; renderPanel(); schedule(true); } }
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if (b && src) setMode(b.dataset.m); });
$('#bDone').onclick=finishTool; $('#bCancel').onclick=cancelTool;
$('#bLUndo').onclick=localUndo; $('#bLRedo').onclick=localRedo;
$('#bHUndo').onclick=globalUndo; $('#bHRedo').onclick=globalRedo;

/* ---------- header ---------- */
$('#bOpen').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ loadFile(e.target.files[0]); e.target.value=''; };
$('#empty').onclick=()=>$('#file').click();
const cmp=$('#bCmp');
const cmpOn=e=>{ if (!prev) return; e.preventDefault(); comparing=true; schedule(false); };
const cmpOff=()=>{ if (comparing){ comparing=false; schedule(false); } };
cmp.addEventListener('pointerdown',cmpOn); ['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,cmpOff));
cmp.addEventListener('contextmenu',e=>e.preventDefault());
function applyLast(){
  const L=lsGet(LS_KEY); if (!L||!src) return;
  const b=clone(S);
  S.adj={...ADJ_DEF,...L.adj}; S.sharp={...S.sharp,...L.sharp}; S.stretch=L.stretch||0;
  if (L.band) S.band=L.band;
  S.angle=L.angle||0;
  if (L.aspect){ S.aspect=L.aspect; if (S.aspect==='free') S.crop={x:0,y:0,w:1,h:1}; else applyAspect(); }
  const sb=src; withBusy(bake);
  hist.splice(hpos); hist.push({tool:'last', ops:[{t:'s',b,a:clone(S),sb,sa:src}]}); hpos=hist.length; if (hist.length>20){ hist.shift(); hpos--; }
  renderPanel(); updateBars(); schedule(true); toast('前回の設定を適用しました');
}

/* ---------- save ---------- */
const dlg=$('#dlg');
function exportScale(){
  const [w,h]=outSize(), max=+$('#size').value;
  let k=1; if (max) k=Math.min(1,max/Math.max(w,h));
  k=Math.min(k,Math.sqrt(SRC_MAX_PX/(w*h)));
  return {k,w:Math.round(w*k),h:Math.round(h*k)};
}
function updInfo(){
  $('#qField').style.display = $('#fmt').value==='image/png' ? 'none' : '';
  $('#qOut').textContent=$('#q').value;
  const {w,h}=exportScale(); $('#outInfo').textContent=`出力サイズ：${w} × ${h}px`;
}
['#fmt','#q','#size'].forEach(s=>$(s).addEventListener('input',updInfo));
$('#bSave').onclick=()=>{
  if (sess) finishTool();
  const E=lsGet(LS_EXP); if (E){ $('#fmt').value=E.fmt; $('#q').value=E.q; $('#size').value=E.size; }
  let canShare=false;
  try { canShare = !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'],{type:'image/png'})],'t.png',{type:'image/png'})]})); } catch {}
  $('#dShare').hidden=!canShare;
  updInfo(); dlg.showModal();
};
$('#dCancel').onclick=()=>dlg.close();
async function makeBlob(){
  $('#busy').style.display='flex';
  await new Promise(r=>setTimeout(r,40));
  try {
    const {k}=exportScale();
    const rScale = k*src.width/prev.width;
    const out=process(src,k,rScale);
    const fmt=$('#fmt').value, q=+$('#q').value/100;
    const blob=await new Promise(r=>out.toBlob(r,fmt,q));
    if (!blob) throw 0;
    { const U={...used}; if (S.crop.w<0.999||S.crop.h<0.999) U.aspect=S.aspect;
      if (U.adj||U.sharp||U.stretch||U.aspect) lsSet(LS_KEY,{adj:U.adj||{...ADJ_DEF},sharp:U.sharp||{amount:0,radius:1},stretch:U.stretch||0,band:U.band||{t:0.55,b:0.97},aspect:U.aspect||'free',angle:U.angle||0}); }
    lsSet(LS_EXP,{fmt,q:$('#q').value,size:$('#size').value});
    const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const name=`${fileBase}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
    return {blob,name};
  } catch { toast('保存に失敗しました（サイズを小さくしてみてください）'); return null; }
  finally { $('#busy').style.display='none'; }
}
$('#dDl').onclick=async()=>{
  const r=await makeBlob(); if (!r) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob); a.download=r.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dlg.close(); toast('保存しました');
};
$('#dShare').onclick=async()=>{
  const r=await makeBlob(); if (!r) return;
  try { await navigator.share({files:[new File([r.blob],r.name,{type:r.blob.type})]}); dlg.close(); }
  catch(e){ if (e && e.name!=='AbortError') toast('共有できませんでした'); }
};

/* ---------- drop / paste ---------- */
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('paste',e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });
window.addEventListener('resize',()=>{ fitPanel(); if (BRUSH_MODES.has(mode)){ resetZoom(); } schedule(false); });

renderPanel();
})();
</script>
</body>
</html>
