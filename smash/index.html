<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Shion's Smash</title>
<style>
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}

<body>
<canvas id="c"></canvas>
<div id="hud"><span id="cnt">0</span><button id="mute" aria-label="sound"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="w1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="w2" d="M19 5a10 10 0 0 1 0 14"/><path id="x1" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button></div>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var paint=document.createElement('canvas'),pctx=paint.getContext('2d');
var W=0,H=0,DPR=1,SCALE=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  paint.width=cv.width;paint.height=cv.height;pctx.setTransform(DPR,0,0,DPR,0,0);
  SCALE=Math.max(0.8,Math.min(1.6,Math.min(W,H)/420));
}
window.addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a);}
function ri(n){return Math.floor(Math.random()*n);}
function easeOutBack(t){var c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t;}
function mk(n){var c=document.createElement('canvas');c.width=c.height=n;return c;}

/* ---------- sprites ---------- */
var HUES=[0,18,36,52,95,145,172,192,212,238,266,290,316,340];
var OR=64;
function sphere(stops,glow,extra){
  var c=mk(OR*4),g=c.getContext('2d'),m=OR*2,gr;
  if(glow){gr=g.createRadialGradient(m,m,OR*0.7,m,m,OR*2);gr.addColorStop(0,glow[0]);gr.addColorStop(1,glow[1]);g.fillStyle=gr;g.fillRect(0,0,OR*4,OR*4);}
  gr=g.createRadialGradient(m-OR*0.35,m-OR*0.4,OR*0.04,m,m,OR);
  stops.forEach(function(s){gr.addColorStop(s[0],s[1]);});
  g.fillStyle=gr;g.beginPath();g.arc(m,m,OR,0,TAU);g.fill();
  if(extra)extra(g,m);
  g.fillStyle='rgba(255,255,255,0.88)';g.beginPath();g.ellipse(m-OR*0.32,m-OR*0.43,OR*0.24,OR*0.12,-0.6,0,TAU);g.fill();
  return c;
}
function hueOrb(h){return sphere([[0,'hsl('+h+',100%,93%)'],[0.22,'hsl('+h+',100%,68%)'],[0.72,'hsl('+h+',92%,47%)'],[1,'hsl('+h+',88%,25%)']],['hsla('+h+',100%,60%,0.42)','hsla('+h+',100%,60%,0)']);}
function glowSprite(col0,col1,col2){
  var c=mk(64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,col0);gr.addColorStop(0.28,col1);gr.addColorStop(1,col2);g.fillStyle=gr;g.fillRect(0,0,64,64);return c;
}
var ORB_SPR=HUES.map(hueOrb);
var GLOW_SPR=HUES.map(function(h){return glowSprite('hsla('+h+',100%,92%,1)','hsla('+h+',100%,65%,0.8)','hsla('+h+',100%,50%,0)');});
var WHITE=glowSprite('rgba(255,255,255,1)','rgba(255,240,220,0.7)','rgba(255,220,200,0)');
var SHARD_COL=HUES.map(function(h){return ['hsl('+h+',95%,52%)','hsl('+h+',100%,68%)','hsl('+h+',100%,84%)'];});
var SPR={
  gold:sphere([[0,'#fffbe6'],[0.2,'#ffe27a'],[0.55,'#f2b81c'],[0.85,'#a86d00'],[1,'#4d3000']],['rgba(255,205,60,0.6)','rgba(255,205,60,0)']),
  bomb:sphere([[0,'#6b6b78'],[0.3,'#2a2a33'],[1,'#050507']],['rgba(255,40,30,0.5)','rgba(255,40,30,0)'],function(g,m){
    g.strokeStyle='rgba(255,90,60,0.9)';g.lineWidth=5;g.beginPath();g.arc(m,m,OR*0.62,0,TAU);g.stroke();
    g.strokeStyle='rgba(255,90,60,0.35)';g.lineWidth=3;g.beginPath();g.arc(m,m,OR*0.82,0,TAU);g.stroke();}),
  split:sphere([[0,'rgba(220,255,240,0.55)'],[0.6,'rgba(80,230,170,0.35)'],[1,'rgba(20,140,110,0.75)']],['rgba(60,255,180,0.45)','rgba(60,255,180,0)'],function(g,m){
    [[-0.3,0.18,0.34,150],[0.3,0.12,0.3,175],[0.02,-0.3,0.28,120]].forEach(function(b){var x=m+b[0]*OR,y=m+b[1]*OR,r=b[2]*OR,h=b[3];
      var gr=g.createRadialGradient(x-r*0.35,y-r*0.4,r*0.05,x,y,r);gr.addColorStop(0,'hsl('+h+',100%,92%)');gr.addColorStop(0.4,'hsl('+h+',100%,62%)');gr.addColorStop(1,'hsl('+h+',90%,30%)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();});}),
  hard:sphere([[0,'rgba(255,255,255,0.95)'],[0.35,'rgba(200,245,255,0.8)'],[0.8,'rgba(110,200,235,0.75)'],[1,'rgba(40,110,150,0.95)']],['rgba(170,235,255,0.5)','rgba(170,235,255,0)'],function(g,m){
    g.strokeStyle='rgba(255,255,255,0.55)';g.lineWidth=2.5;g.beginPath();
    for(var i=0;i<6;i++){var a=i*TAU/6+0.3,x=m+Math.cos(a)*OR*0.55,y=m+Math.sin(a)*OR*0.55;if(i)g.lineTo(x,y);else g.moveTo(x,y);}
    g.closePath();g.stroke();
    for(i=0;i<6;i++){a=i*TAU/6+0.3;g.beginPath();g.moveTo(m+Math.cos(a)*OR*0.55,m+Math.sin(a)*OR*0.55);g.lineTo(m+Math.cos(a)*OR*0.97,m+Math.sin(a)*OR*0.97);g.stroke();}}),
  rain:(function(){var c=mk(OR*4),g=c.getContext('2d'),m=OR*2,gr=g.createRadialGradient(m,m,OR*0.7,m,m,OR*2);
    gr.addColorStop(0,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,OR*4,OR*4);
    if(g.createConicGradient){gr=g.createConicGradient(0,m,m);for(var i=0;i<=6;i++)gr.addColorStop(i/6,'hsl('+(i*60)+',100%,60%)');}
    else{gr=g.createLinearGradient(m-OR,m,m+OR,m);for(i=0;i<=6;i++)gr.addColorStop(i/6,'hsl('+(i*60)+',100%,60%)');}
    g.fillStyle=gr;g.beginPath();g.arc(m,m,OR,0,TAU);g.fill();
    gr=g.createRadialGradient(m-OR*0.3,m-OR*0.35,0,m,m,OR);gr.addColorStop(0,'rgba(255,255,255,0.75)');gr.addColorStop(0.5,'rgba(255,255,255,0.1)');gr.addColorStop(1,'rgba(0,0,0,0.35)');
    g.fillStyle=gr;g.beginPath();g.arc(m,m,OR,0,TAU);g.fill();
    g.fillStyle='rgba(255,255,255,0.9)';g.beginPath();g.ellipse(m-OR*0.32,m-OR*0.43,OR*0.24,OR*0.12,-0.6,0,TAU);g.fill();return c;})()
};
var TYPE_COL={gold:['#ffd84a','#fff1a8','#c98a12'],bomb:['#ff3b2f','#ff9a3c','#3a3a44'],split:['#5dffc0','#c8fff0','#20c090'],hard:['#e8fbff','#9ee7ff','#ffffff']};
var TYPE_HI={gold:3,bomb:0,split:6,hard:7};
var UNLOCK=[['gold',10],['bomb',20],['split',35],['hard',50],['rain',75]];
var PROB={gold:0.07,bomb:0.055,split:0.06,hard:0.05,rain:0.025};

/* ---------- state ---------- */
var orbs=[],shards=[],glows=[],rings=[],slashes=[],ghosts=[],events=[],pointers={};
var T=0,shake=0,flash=0,combo=0,lastHit=-9,comboPop=0,bgHue=rand(0,360),pending=0,banner=null,fadeAcc=0;
var gauge=0,fever=false,feverStart=0,feverEnd=0,FEVER_LEN=9,nextBeat=0,beatStep=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var count=parseInt(ls('smash_count')||'0',10)||0;
var unlocked=Math.min(5,parseInt(ls('smash_unlock')||'0',10)||0);
var cntEl=document.getElementById('cnt');cntEl.textContent=count;
function addCount(n){count+=n;cntEl.textContent=count;ls('smash_count',count);}
function at(t,fn){events.push({t:t,fn:fn});}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- audio ---------- */
var AC=null,master=null,noiseBuf=null,muted=ls('smash_muted')==='1';
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;comp.attack.value=0.002;comp.release.value=0.15;
    master=AC.createGain();master.gain.value=muted?0:0.75;master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function on(){return AC&&!muted;}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(type,f0,f1,dur,peak,t){
  t=t||AC.currentTime;var o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  env(g,t,0.004,peak,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(ft,f0,f1,q,dur,peak,t){
  t=t||AC.currentTime;var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  var f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=AC.createGain();env(g,t,0.003,peak,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);
}
var SEMI=[0,2,4,7,9];
function noteF(i){i=Math.max(0,i-1)%15;return 261.63*Math.pow(2,(SEMI[i%5]+12*Math.floor(i/5))/12);}
function sPop(c,p){if(!on())return;var f=noteF(c);
  tone('sine',f,f*0.5,0.24,0.32);tone('triangle',f*2,f*2.01,0.08,0.1);
  noise('bandpass',4200,1100,0.9,0.15,0.45*p);tone('sine',150,42,0.22,0.6*Math.min(1.4,p));}
function sRipple(){if(!on())return;tone('sine',210,70,0.18,0.3);noise('lowpass',1000,200,0.7,0.12,0.25);}
function sWhoosh(){if(!on())return;noise('bandpass',700,5200,1.4,0.17,0.22);}
function sBoom(c){if(!on())return;var t=AC.currentTime;
  tone('sine',100,26,1.2,1.0,t);noise('lowpass',3000,110,0.6,1.3,0.55+0.4*c,t);
  [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone('sine',f,f,1.6,0.06,t+0.05+i*0.035);});}
function sGold(){if(!on())return;var t=AC.currentTime;
  [1046.5,1318.5,1568,2093,2637].forEach(function(f,i){tone('triangle',f,f,0.3,0.12,t+i*0.045);tone('sine',f*2,f*2,0.18,0.04,t+i*0.045);});}
function sBomb(){if(!on())return;tone('sine',90,28,0.75,0.95);noise('lowpass',2600,140,0.7,0.85,0.75);noise('bandpass',5000,900,0.8,0.25,0.4);}
function sClink(){if(!on())return;tone('triangle',2400,2250,0.09,0.2);tone('sine',3600,3500,0.06,0.08);noise('highpass',6500,4000,0.7,0.05,0.22);}
function sShatter(){if(!on())return;var t=AC.currentTime;
  for(var i=0;i<5;i++)noise('bandpass',rand(2500,7000),rand(700,2000),1.3,0.1+i*0.05,0.38,t+i*0.025);
  tone('sine',170,40,0.32,0.75,t);[2093,2637,3136].forEach(function(f,i){tone('triangle',f,f*0.98,0.4,0.05,t+0.02+i*0.04);});}
function sSplit(){if(!on())return;var t=AC.currentTime;[0,1,2,3,4].forEach(function(i){var f=600+i*180;tone('sine',f,f*1.6,0.1,0.12,t+i*0.03);});}
function sUnlock(){if(!on())return;var t=AC.currentTime;
  noise('bandpass',300,7000,1,0.7,0.2,t);
  [261.63,329.63,392,523.25,659.25,783.99,1046.5].forEach(function(f,i){tone('sine',f,f,1.5,0.08,t+i*0.07);tone('triangle',f*2,f*2,0.5,0.03,t+i*0.07);});}
function sFever(){if(!on())return;var t=AC.currentTime;
  noise('bandpass',250,9000,1,0.55,0.35,t);tone('sawtooth',110,880,0.55,0.07,t);
  [523.25,659.25,783.99,1046.5,1318.5,1568,2093].forEach(function(f,i){tone('square',f,f,0.12,0.035,t+0.3+i*0.04);});}
function kick(t){tone('sine',160,40,0.24,0.65,t);tone('triangle',90,45,0.12,0.2,t);}
function hat(t){noise('highpass',9000,7000,0.7,0.04,0.13,t);}
function clap(t){noise('bandpass',1700,1200,1.6,0.13,0.32,t);}
function bass(t,f){tone('sawtooth',f,f,0.18,0.06,t);}
function beatTick(){
  if(!on()||!fever)return;
  if(nextBeat<AC.currentTime)nextBeat=AC.currentTime+0.02;
  var BASS=[65.41,65.41,77.78,87.31];
  while(nextBeat<AC.currentTime+0.15){var s=beatStep%8;
    if(s%2===0)kick(nextBeat);else hat(nextBeat);
    if(s===2||s===6)clap(nextBeat);
    bass(nextBeat,BASS[Math.floor(beatStep/8)%4]*(s%2?2:1));
    nextBeat+=0.2344;beatStep++;}
}
function chargeStart(p){if(!on())return;
  var o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;
  o.type='sawtooth';o2.type='square';o.frequency.value=70;o2.frequency.value=70.7;f.type='lowpass';f.frequency.value=300;f.Q.value=6;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06,t+0.08);
  o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start(t);o2.start(t);p.snd={o:o,o2:o2,f:f,g:g};}
function chargeUpd(p,c){if(!p.snd)return;var t=AC.currentTime,fr=70+c*c*360;
  p.snd.o.frequency.setTargetAtTime(fr,t,0.03);p.snd.o2.frequency.setTargetAtTime(fr*1.01,t,0.03);
  p.snd.f.frequency.setTargetAtTime(300+c*3000,t,0.03);p.snd.g.gain.setTargetAtTime(0.05+0.06*c,t,0.05);}
function chargeStop(p){if(!p.snd)return;var t=AC.currentTime,s=p.snd;
  s.g.gain.cancelScheduledValues(t);s.g.gain.setTargetAtTime(0.0001,t,0.03);s.o.stop(t+0.2);s.o2.stop(t+0.2);p.snd=null;}

/* ---------- spawn ---------- */
function target(){var n=Math.max(7,Math.min(22,Math.round(W*H/(42000*SCALE*SCALE))));return fever?Math.min(40,Math.round(n*2.1)):n;}
function countType(t){var n=0;for(var i=0;i<orbs.length;i++)if(orbs[i].type===t)n++;return n;}
function pickType(){
  var r=Math.random(),acc=0,mult=fever?1.8:1;
  for(var i=0;i<unlocked;i++){var t=UNLOCK[i][0],p=PROB[t]*mult*(t==='rain'&&fever?0.3:1);acc+=p;
    if(r<acc)return countType(t)<2?t:'n';}
  return 'n';
}
function makeOrb(type,x,y,r,vx,vy,hi){
  return {x:x,y:y,vx:vx,vy:vy,base:Math.hypot(vx,vy)*1.3+10,r:r,hi:hi,type:type,hp:type==='hard'?3:1,cracks:[],hitT:-9,
    t0:T,ph:rand(0,TAU),ws:rand(2,4),alive:true,doomed:false};
}
function spawnOrb(type,px,py){
  if(px===undefined)pending--;
  type=type||pickType();
  var r=rand(26,46)*SCALE*(type==='n'?1:1.12),x=px,y=py;
  if(x===undefined){for(var k=0;k<14;k++){x=rand(r+8,W-r-8);y=rand(r+48,H-r-16);
    var ok=true;for(var j=0;j<orbs.length;j++){var o=orbs[j];if(Math.hypot(o.x-x,o.y-y)<o.r+r+10){ok=false;break;}}if(ok)break;}}
  var a=rand(0,TAU),sp=rand(14,42)*SCALE*(fever?1.6:1);
  var ob=makeOrb(type,x,y,r,Math.cos(a)*sp,Math.sin(a)*sp,ri(HUES.length));orbs.push(ob);return ob;
}

/* ---------- effects ---------- */
function splat(x,y,r,hi,strong){
  var col='hsla('+HUES[hi]+',95%,55%,';pctx.globalCompositeOperation='source-over';
  pctx.fillStyle=col+(strong?0.22:0.15)+')';pctx.beginPath();pctx.arc(x,y,r*1.5,0,TAU);pctx.fill();
  for(var k=0;k<11;k++){var a=rand(0,TAU),d=rand(r*0.6,r*3.2),rr=rand(2,r*0.28);
    pctx.fillStyle=col+rand(0.25,0.55).toFixed(2)+')';pctx.beginPath();pctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rr,0,TAU);pctx.fill();}
}
function hitCombo(){
  combo=(T-lastHit<1.4)?combo+1:1;lastHit=T;comboPop=1;
  if(unlocked<UNLOCK.length&&combo>=UNLOCK[unlocked][1]){var lv=unlocked+1;unlocked=lv;ls('smash_unlock',lv);at(T+0.25,function(){unlockFx(lv-1);});}
}
function addGauge(v){if(fever)return;gauge=Math.min(1,gauge+v);if(gauge>=1)at(T+0.05,startFever);}
function burstShards(x,y,r,n,power,pal,dir,vx,vy){
  for(var i=0;i<n;i++){
    var a=rand(0,TAU),sp=rand(250,850)*power*SCALE;
    if(dir)a=Math.atan2(dir.y,dir.x)+(Math.random()<0.5?1:-1)*Math.PI/2+rand(-0.8,0.8);
    var off=Math.random()*r*0.5,L=rand(0.7,1.5);
    shards.push({x:x+Math.cos(a)*off,y:y+Math.sin(a)*off,vx:Math.cos(a)*sp+(vx||0),vy:Math.sin(a)*sp+(vy||0)-140*SCALE,rot:rand(0,TAU),vr:rand(-15,15),s:rand(0.12,0.38)*r,
      c:pal?pal[ri(pal.length)]:SHARD_COL[ri(HUES.length)][ri(3)],life:L,max:L});
  }
}
function burstGlows(x,y,n,spMax,hiFn,sMax){
  for(var i=0;i<n;i++){var a=rand(0,TAU),sp=rand(80,spMax)*SCALE,L=rand(0.3,0.85);
    glows.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:L,max:L,s:rand(5,sMax||13)*SCALE,hi:hiFn(),drag:3});}
}
function pushAway(x,y,R,F,skip){
  for(var i=0;i<orbs.length;i++){var q=orbs[i];if(q===skip||!q.alive)continue;
    var dx=q.x-x,dy=q.y-y,d=Math.hypot(dx,dy)||1;if(d<R){var f=(1-d/R)*F*SCALE;q.vx+=dx/d*f;q.vy+=dy/d*f;}}
}
function chainAround(x,y,R,speed,power){
  orbs.forEach(function(q){if(!q.alive||q.doomed)return;var d=Math.hypot(q.x-x,q.y-y);

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  for(var i=events.length-1;i>=0;i--){if(events[i].t<=T){var ev=events.splice(i,1)[0];ev.fn();}}
  while(orbs.length+pending<target()){pending++;at(T+(fever?rand(0.03,0.2):rand(0.12,0.7))+pending*(fever?0.015:0.04),spawnOrb);}
  if(fever){beatTick();if(T>=feverEnd)endFever();}
  else{gauge=Math.max(0,gauge-dt*(T-lastHit>1.0?0.3:0.06));}
  var k;
  for(k in pointers){var p=pointers[k];
    if(p.mode==='idle'&&T-p.t0>0.22){p.mode='charge';p.cs=T;chargeStart(p);}
    if(p.mode==='charge'){
      p.c=Math.min(1,(T-p.cs)/1.3);chargeUpd(p,p.c);
      if(T-p.lv>0.12){vib(Math.round(8+p.c*22));p.lv=T;}
      var n=2+Math.round(p.c*5);
      for(var j=0;j<n;j++){var a=rand(0,TAU),rr=(60+p.c*110)*SCALE*rand(1,1.8),L=0.32;
        glows.push({x:p.x+Math.cos(a)*rr,y:p.y+Math.sin(a)*rr,vx:-Math.cos(a)*rr/L,vy:-Math.sin(a)*rr/L,life:L,max:L,s:rand(3,7)*SCALE,hi:p.c>=1?-1:ri(HUES.length),drag:0});}
      var G=(260+320*p.c)*SCALE;
      orbs.forEach(function(o){var dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1;if(d<G&&d>o.r){var f=600*p.c*SCALE*dt*(1-d/G);o.vx+=dx/d*f;o.vy+=dy/d*f;}});
      shake=Math.max(shake,p.c*3);
    }
  }
  orbs.forEach(function(o){
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)*0.8;}else if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)*0.8;}
    if(o.y<o.r){o.y=o.r;o.vy=Math.abs(o.vy)*0.8;}else if(o.y>H-o.r){o.y=H-o.r;o.vy=-Math.abs(o.vy)*0.8;}
    var sp=Math.hypot(o.vx,o.vy);if(sp>o.base){var kk=Math.exp(-2.2*dt);o.vx*=kk;o.vy*=kk;}
    o.ph+=dt*o.ws;if(o.squash)o.squash*=Math.exp(-8*dt);
  });
  orbs=orbs.filter(function(o){return o.alive;});
  var g=1500*SCALE;
  for(i=shards.length-1;i>=0;i--){var s=shards[i];s.life-=dt;if(s.life<=0||s.y>H+80){shards[i]=shards[shards.length-1];shards.pop();continue;}
    s.vy+=g*dt;var dr=Math.exp(-0.9*dt);s.vx*=dr;s.vy*=dr;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;
    if(s.y>H-4&&s.vy>0){s.y=H-4;s.vy*=-0.35;s.vx*=0.7;s.vr*=0.6;}}
  for(i=glows.length-1;i>=0;i--){var q=glows[i];q.life-=dt;if(q.life<=0){glows[i]=glows[glows.length-1];glows.pop();continue;}
    if(q.drag){var d2=Math.exp(-q.drag*dt);q.vx*=d2;q.vy*=d2;}q.x+=q.vx*dt;q.y+=q.vy*dt;}
  if(glows.length>1800)glows.splice(0,glows.length-1800);
  if(shards.length>1600)shards.splice(0,shards.length-1600);
  rings=rings.filter(function(r){r.life-=dt;return r.life>0;});
  slashes=slashes.filter(function(r){r.life-=dt;return r.life>0;});
  ghosts=ghosts.filter(function(tr){return tr.length&&T-tr[tr.length-1].t<0.2;});
  for(k in pointers){var tr=pointers[k].trail;while(tr.length>1&&T-tr[0].t>0.2)tr.shift();}
  shake*=Math.exp(-9*dt);if(shake<0.05)shake=0;
  flash*=Math.exp(-6*dt);comboPop*=Math.exp(-10*dt);

  fadeAcc+=dt;if(fadeAcc>0.4){fadeAcc=0;pctx.globalCompositeOperation='destination-out';pctx.fillStyle='rgba(0,0,0,0.06)';pctx.fillRect(0,0,W,H);pctx.globalCompositeOperation='source-over';}
}

      ctx.lineWidth=(pass?7:20)*k*SCALE+1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
}

    if(o.type==='hard'&&o.cracks.length){ctx.setTransform(DPR,0,0,DPR,DPR*ox,DPR*oy);var rr=o.r*sc;
      ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.6;ctx.lineJoin='round';

      var sa=T*2+r2.ph,L2=r2.r*0.9*(0.7+0.3*Math.sin(T*5+r2.ph));ctx.strokeStyle='rgba(255,245,200,0.8)';ctx.lineWidth=1.5;

  ctx.globalAlpha=1;
  // rings
  rings.forEach(function(r){var t=1-r.life/r.max,e=1-Math.pow(1-t,3),rad=r.r0+(r.r1-r.r0)*e;
    ctx.strokeStyle=r.h<0?'rgba(255,255,255,'+(1-t)+')':'hsla('+r.h+',100%,72%,'+(1-t)+')';
    ctx.lineWidth=r.w*(1-t)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke();});
  // glows
  for(i=0;i<glows.length;i++){var q=glows[i];ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.drawImage(q.hi<0?WHITE:GLOW_SPR[q.hi],q.x-q.s,q.y-q.s,q.s*2,q.s*2);}
  ctx.globalAlpha=1;
  // slashes
  ctx.lineCap='round';
  slashes.forEach(function(l){var k=l.life/l.max;ctx.strokeStyle='rgba(255,255,255,'+k+')';ctx.lineWidth=9*k*SCALE+1;
    ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();});
  // trails
  ghosts.forEach(drawTrail);
  var k;for(k in pointers){var p=pointers[k];if(p.mode!=='charge')drawTrail(p.trail);}
  // charge
  for(k in pointers){var pc=pointers[k];if(pc.mode!=='charge')continue;var c2=pc.c,full=c2>=1,pulse=full?1+Math.sin(T*30)*0.12:1;
    var csz=(24+c2*70)*SCALE*pulse;ctx.drawImage(WHITE,pc.x-csz,pc.y-csz,csz*2,csz*2);
    var rr2=(38+c2*44)*SCALE*pulse;
    ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=5*SCALE;ctx.beginPath();ctx.arc(pc.x,pc.y,rr2,0,TAU);ctx.stroke();
    ctx.strokeStyle=full?'rgba(255,255,255,0.95)':'hsla('+bgHue+',100%,72%,0.95)';ctx.lineWidth=5*SCALE;
    ctx.beginPath();ctx.arc(pc.x,pc.y,rr2,-Math.PI/2,-Math.PI/2+TAU*c2);ctx.stroke();}
  // gauge (bottom light line)
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var gv=fever?Math.max(0,(feverEnd-T)/FEVER_LEN):gauge;
  if(gv>0.003){var gw=W*gv,gy=H-3,gx=(W-gw)/2,ga=fever?1:Math.min(1,0.35+gv*0.65)*(gv>0.8?0.75+0.25*Math.sin(T*18):1);
    var gg=ctx.createLinearGradient(gx,0,gx+gw,0);
    if(fever){for(var s3=0;s3<=6;s3++)gg.addColorStop(s3/6,'hsla('+((bgHue+s3*60)%360)+',100%,65%,1)');}
    else{gg.addColorStop(0,'hsla('+bgHue+',100%,65%,'+ga+')');gg.addColorStop(0.5,'rgba(255,255,255,'+ga+')');gg.addColorStop(1,'hsla('+bgHue+',100%,65%,'+ga+')');}
    ctx.fillStyle=gg;ctx.shadowColor='hsl('+bgHue+',100%,65%)';ctx.shadowBlur=14;ctx.fillRect(gx,gy-1.5*SCALE,gw,3*SCALE);ctx.shadowBlur=0;}
  ctx.globalCompositeOperation='source-over';
  // combo
  ctx.setTransform(DPR,0,0,DPR,sx*DPR*0.5,sy*DPR*0.5);ctx.textAlign='center';ctx.textBaseline='middle';
  var since=T-lastHit;
  if(combo>=3&&since<1.6){var al=Math.min(1,(1.6-since)/0.4),sc2=1+comboPop*0.45,fs=Math.round(64*SCALE*sc2);
    ctx.globalAlpha=al;ctx.fillStyle='hsl('+((combo*23)%360)+',100%,72%)';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=24;
    ctx.font='900 '+fs+'px system-ui,-apple-system,sans-serif';ctx.fillText(combo,W/2,H*0.24);
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='800 '+Math.round(14*SCALE)+'px system-ui,sans-serif';
    ctx.fillText('C O M B O',W/2,H*0.24+fs*0.62);ctx.globalAlpha=1;}
  if(banner){var bt=T-banner.t0;if(bt>1.4)banner=null;else{
    var bs=bt<0.25?easeOutBack(bt/0.25):1+(bt-0.25)*0.08,ba=bt>1.0?1-(bt-1.0)/0.4:1;
    ctx.globalAlpha=Math.max(0,ba);ctx.fillStyle='hsl('+((bgHue+180)%360)+',100%,78%)';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=34;
    ctx.font='900 italic '+Math.round(68*SCALE*bs)+'px system-ui,sans-serif';ctx.fillText(banner.text,W/2,H*0.44);
    ctx.shadowBlur=0;ctx.globalAlpha=1;}}
  if(flash>0.01){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(255,250,240,'+flash+')';ctx.fillRect(0,0,W,H);}
}

if(location.hash==='#debug'){window.__smash={unlockAll:function(){unlocked=5;},fever:startFever,spawn:function(t){return spawnOrb(t,W/2,H/2);},state:function(){return {orbs:orbs.length,unlocked:unlocked,gauge:gauge,fever:fever,combo:combo,types:orbs.map(function(o){return o.type;})};}};}

var last=performance.now();
function frame(now){var dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
