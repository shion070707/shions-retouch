<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smash">
<title>Shion's Smash</title>
<style>
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:14px;right:8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font:700 13px/1 system-ui,-apple-system,sans-serif;color:rgba(255,255,255,.4);letter-spacing:.12em}
#mute{pointer-events:auto;background:none;border:0;color:rgba(255,255,255,.45);padding:8px;cursor:pointer;line-height:0}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16%);text-align:center;font:500 15px system-ui,sans-serif;color:rgba(255,255,255,.5);letter-spacing:.4em;pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="cnt">0</span><button id="mute" aria-label="sound"><svg id="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="w1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="w2" d="M19 5a10 10 0 0 1 0 14"/><path id="x1" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button></div>
<div id="hint">さわって こわす</div>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var paint=document.createElement('canvas'),pctx=paint.getContext('2d');
var W=0,H=0,DPR=1,SCALE=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  paint.width=cv.width;paint.height=cv.height;pctx.setTransform(DPR,0,0,DPR,0,0);
  SCALE=Math.max(0.8,Math.min(1.6,Math.min(W,H)/420));
}
window.addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a);}
function ri(n){return Math.floor(Math.random()*n);}
function easeOutBack(t){var c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t;}

/* ---------- sprites ---------- */
var HUES=[0,18,36,52,95,145,172,192,212,238,266,290,316,340];
var OR=64;
function orbSprite(h){
  var c=document.createElement('canvas');c.width=c.height=OR*4;var g=c.getContext('2d'),m=OR*2;
  var gr=g.createRadialGradient(m,m,OR*0.7,m,m,OR*2);
  gr.addColorStop(0,'hsla('+h+',100%,60%,0.42)');gr.addColorStop(1,'hsla('+h+',100%,60%,0)');
  g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  gr=g.createRadialGradient(m-OR*0.35,m-OR*0.4,OR*0.04,m,m,OR);
  gr.addColorStop(0,'hsl('+h+',100%,93%)');gr.addColorStop(0.22,'hsl('+h+',100%,68%)');
  gr.addColorStop(0.72,'hsl('+h+',92%,47%)');gr.addColorStop(1,'hsl('+h+',88%,25%)');
  g.fillStyle=gr;g.beginPath();g.arc(m,m,OR,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,0.88)';g.beginPath();g.ellipse(m-OR*0.32,m-OR*0.43,OR*0.24,OR*0.12,-0.6,0,TAU);g.fill();
  return c;
}
function glowSprite(h,white){
  var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');
  var gr=g.createRadialGradient(32,32,0,32,32,32);
  if(white){gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.3,'rgba(255,240,220,0.7)');gr.addColorStop(1,'rgba(255,220,200,0)');}
  else{gr.addColorStop(0,'hsla('+h+',100%,92%,1)');gr.addColorStop(0.25,'hsla('+h+',100%,65%,0.8)');gr.addColorStop(1,'hsla('+h+',100%,50%,0)');}
  g.fillStyle=gr;g.fillRect(0,0,64,64);return c;
}
var ORB_SPR=HUES.map(function(h){return orbSprite(h);});
var GLOW_SPR=HUES.map(function(h){return glowSprite(h);});
var WHITE=glowSprite(0,true);
var SHARD_COL=HUES.map(function(h){return ['hsl('+h+',95%,52%)','hsl('+h+',100%,68%)','hsl('+h+',100%,84%)'];});

/* ---------- state ---------- */
var orbs=[],shards=[],glows=[],rings=[],slashes=[],ghosts=[],events=[],pointers={};
var T=0,shake=0,flash=0,combo=0,lastHit=-9,comboPop=0,bgHue=rand(0,360),pending=0,banner=null,fadeAcc=0;
var count=0;try{count=parseInt(localStorage.getItem('smash_count')||'0',10)||0;}catch(e){}
var cntEl=document.getElementById('cnt');cntEl.textContent=count;
function at(t,fn){events.push({t:t,fn:fn});}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- audio ---------- */
var AC=null,master=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('smash_muted')==='1';}catch(e){}
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;comp.attack.value=0.002;comp.release.value=0.15;
    master=AC.createGain();master.gain.value=muted?0:0.75;master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(type,f0,f1,dur,peak,t){
  t=t||AC.currentTime;var o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  env(g,t,0.004,peak,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(ft,f0,f1,q,dur,peak,t){
  t=t||AC.currentTime;var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  var f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=AC.createGain();env(g,t,0.003,peak,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);
}
var SEMI=[0,2,4,7,9];
function noteF(i){i=Math.max(0,i-1)%15;return 261.63*Math.pow(2,(SEMI[i%5]+12*Math.floor(i/5))/12);}
function sPop(c,p){if(!AC||muted)return;var f=noteF(c);
  tone('sine',f,f*0.5,0.24,0.32);tone('triangle',f*2,f*2.01,0.08,0.1);
  noise('bandpass',4200,1100,0.9,0.15,0.45*p);tone('sine',150,42,0.22,0.6*Math.min(1.4,p));}
function sRipple(){if(!AC||muted)return;tone('sine',210,70,0.18,0.3);noise('lowpass',1000,200,0.7,0.12,0.25);}
function sWhoosh(){if(!AC||muted)return;noise('bandpass',700,5200,1.4,0.17,0.22);}
function sBoom(c){if(!AC||muted)return;var t=AC.currentTime;
  tone('sine',100,26,1.2,1.0,t);noise('lowpass',3000,110,0.6,1.3,0.55+0.4*c,t);
  [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone('sine',f,f,1.6,0.06,t+0.05+i*0.035);});}
function sMilestone(){if(!AC||muted)return;var t=AC.currentTime;
  [0,4,7,12,16,19,24].forEach(function(s,i){var f=523.25*Math.pow(2,s/12);tone('triangle',f,f,0.35,0.09,t+i*0.045);});}
function chargeStart(p){if(!AC||muted)return;
  var o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;
  o.type='sawtooth';o2.type='square';o.frequency.value=70;o2.frequency.value=70.7;f.type='lowpass';f.frequency.value=300;f.Q.value=6;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06,t+0.08);
  o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start(t);o2.start(t);p.snd={o:o,o2:o2,f:f,g:g};}
function chargeUpd(p,c){if(!p.snd)return;var t=AC.currentTime,fr=70+c*c*360;
  p.snd.o.frequency.setTargetAtTime(fr,t,0.03);p.snd.o2.frequency.setTargetAtTime(fr*1.01,t,0.03);
  p.snd.f.frequency.setTargetAtTime(300+c*3000,t,0.03);p.snd.g.gain.setTargetAtTime(0.05+0.06*c,t,0.05);}
function chargeStop(p){if(!p.snd)return;var t=AC.currentTime,s=p.snd;
  s.g.gain.cancelScheduledValues(t);s.g.gain.setTargetAtTime(0.0001,t,0.03);s.o.stop(t+0.2);s.o2.stop(t+0.2);p.snd=null;}

/* ---------- spawn ---------- */
function target(){return Math.max(7,Math.min(22,Math.round(W*H/(42000*SCALE*SCALE))));}
function spawnOrb(){
  pending--;var r=rand(26,46)*SCALE,x=W/2,y=H/2;
  for(var k=0;k<14;k++){x=rand(r+8,W-r-8);y=rand(r+48,H-r-16);
    var ok=true;for(var j=0;j<orbs.length;j++){var o=orbs[j];if(Math.hypot(o.x-x,o.y-y)<o.r+r+10){ok=false;break;}}if(ok)break;}
  var a=rand(0,TAU),sp=rand(14,42)*SCALE;
  orbs.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,base:sp*1.3+10,r:r,hi:ri(HUES.length),t0:T,ph:rand(0,TAU),ws:rand(2,4),alive:true,doomed:false});
}

/* ---------- effects ---------- */
function splat(x,y,r,hi,strong){
  var col='hsla('+HUES[hi]+',95%,55%,';pctx.globalCompositeOperation='source-over';
  pctx.fillStyle=col+(strong?0.22:0.15)+')';pctx.beginPath();pctx.arc(x,y,r*1.5,0,TAU);pctx.fill();
  for(var k=0;k<11;k++){var a=rand(0,TAU),d=rand(r*0.6,r*3.2),rr=rand(2,r*0.28);
    pctx.fillStyle=col+rand(0.25,0.55).toFixed(2)+')';pctx.beginPath();pctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rr,0,TAU);pctx.fill();}
}
var WORDS={10:'NICE',25:'GREAT',50:'INSANE',100:'LEGEND',200:'GOD'};
function explode(o,opt){
  if(!o.alive)return;o.alive=false;opt=opt||{};var power=opt.power||1,dir=opt.dir;
  combo=(T-lastHit<1.4)?combo+1:1;lastHit=T;comboPop=1;
  count++;cntEl.textContent=count;try{localStorage.setItem('smash_count',count);}catch(e){}
  var n=Math.round((16+10*power)*(o.r/(38*SCALE))),i,a,sp,L;
  for(i=0;i<n;i++){
    a=rand(0,TAU);sp=rand(250,850)*power*SCALE;
    if(dir){a=Math.atan2(dir.y,dir.x)+(Math.random()<0.5?1:-1)*Math.PI/2+rand(-0.8,0.8);}
    var off=Math.random()*o.r*0.5;L=rand(0.7,1.5);
    shards.push({x:o.x+Math.cos(a)*off,y:o.y+Math.sin(a)*off,vx:Math.cos(a)*sp+o.vx,vy:Math.sin(a)*sp+o.vy-140*SCALE,rot:rand(0,TAU),vr:rand(-15,15),s:rand(0.12,0.38)*o.r,c:SHARD_COL[o.hi][ri(3)],life:L,max:L});
  }
  for(i=0;i<22;i++){a=rand(0,TAU);sp=rand(80,680)*power*SCALE;L=rand(0.3,0.85);
    glows.push({x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:L,max:L,s:rand(5,13)*SCALE,hi:Math.random()<0.25?-1:o.hi,drag:3});}
  glows.push({x:o.x,y:o.y,vx:0,vy:0,life:0.22,max:0.22,s:o.r*3,hi:-1,drag:0});
  rings.push({x:o.x,y:o.y,r0:o.r*0.8,r1:o.r*(3.2+power),life:0.45,max:0.45,h:HUES[o.hi],w:7*SCALE});
  splat(o.x,o.y,o.r,o.hi,power>1.2);
  shake=Math.min(30,shake+5*power);flash=Math.min(0.6,flash+0.035*power);
  for(i=0;i<orbs.length;i++){var q=orbs[i];if(q===o||!q.alive)continue;
    var dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy)||1,R=o.r*5;
    if(d<R){var f=(1-d/R)*480*power*SCALE;q.vx+=dx/d*f;q.vy+=dy/d*f;}}
  sPop(combo,power);vib(power>1.2?28:16);
  if(WORDS[combo]){banner={text:WORDS[combo],t0:T,h:(combo*23)%360};flash=Math.min(0.8,flash+0.25);shake+=10;sMilestone();vib([20,30,20,30,40]);}
}
function tapEmpty(x,y){
  rings.push({x:x,y:y,r0:6,r1:120*SCALE,life:0.38,max:0.38,h:-1,w:5*SCALE});
  for(var i=0;i<12;i++){var a=rand(0,TAU),sp=rand(60,380)*SCALE,L=rand(0.25,0.6);
    glows.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:L,max:L,s:rand(4,9)*SCALE,hi:ri(HUES.length),drag:4});}
  var R=250*SCALE;
  orbs.forEach(function(o){var dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1;if(d<R){var f=(1-d/R)*420*SCALE;o.vx+=dx/d*f;o.vy+=dy/d*f;}});
  shake=Math.min(30,shake+2);sRipple();vib(8);
}
function mega(x,y,c){
  var R=130*SCALE+c*Math.hypot(W,H);
  rings.push({x:x,y:y,r0:20,r1:R,life:0.7,max:0.7,h:-1,w:18*SCALE});
  rings.push({x:x,y:y,r0:10,r1:R*0.7,life:0.95,max:0.95,h:bgHue,w:10*SCALE});
  glows.push({x:x,y:y,vx:0,vy:0,life:0.35,max:0.35,s:(120+260*c)*SCALE,hi:-1,drag:0});
  for(var i=0;i<70;i++){var a=rand(0,TAU),sp=rand(200,1400)*SCALE*(0.4+c),L=rand(0.4,1.1);
    glows.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:L,max:L,s:rand(5,16)*SCALE,hi:Math.random()<0.4?-1:ri(HUES.length),drag:2.5});}
  for(i=0;i<16;i++){var aa=rand(0,TAU),dd=rand(20,R*0.35);splat(x+Math.cos(aa)*dd,y+Math.sin(aa)*dd,rand(8,26)*SCALE,ri(HUES.length),true);}
  flash=Math.min(0.9,0.2+0.6*c);shake=Math.min(45,12+32*c);sBoom(c);vib([25,20,60+Math.round(90*c)]);
  orbs.forEach(function(o){if(!o.alive||o.doomed)return;var dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1;
    if(d<R){o.doomed=true;o.vx+=dx/d*300*SCALE;o.vy+=dy/d*300*SCALE;at(T+d/1500+rand(0,0.06),function(){explode(o,{power:1.35});});}});
}

/* ---------- input ---------- */
var hint=document.getElementById('hint'),hinted=false;
function segDist(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;
  var x=ax+dx*t-px,y=ay+dy*t-py;return Math.sqrt(x*x+y*y);}
function orbAt(x,y){var best=null,bd=1e9;orbs.forEach(function(o){if(!o.alive||o.doomed)return;var d=Math.hypot(o.x-x,o.y-y);if(d<o.r*1.25&&d<bd){bd=d;best=o;}});return best;}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  if(!hinted){hinted=true;hint.style.opacity='0';}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  var x=e.clientX,y=e.clientY,p={x:x,y:y,sx:x,sy:y,t0:T,ts:e.timeStamp,mode:'idle',trail:[{x:x,y:y,t:T}],wt:-9,cs:0,c:0,lv:0,snd:null};
  pointers[e.pointerId]=p;
  var o=orbAt(x,y);if(o){explode(o,{power:1});p.mode='swipe';}
});
cv.addEventListener('pointermove',function(e){
  var p=pointers[e.pointerId];if(!p)return;
  var x=e.clientX,y=e.clientY,px=p.x,py=p.y,dt=Math.max(1,e.timeStamp-p.ts)/1000;
  var dist=Math.hypot(x-px,y-py),speed=dist/dt;
  p.x=x;p.y=y;p.ts=e.timeStamp;p.trail.push({x:x,y:y,t:T});
  if(p.mode==='idle'&&Math.hypot(x-p.sx,y-p.sy)>12*SCALE)p.mode='swipe';
  if(p.mode==='swipe'){
    if(speed>900&&T-p.wt>0.2){sWhoosh();p.wt=T;}
    if(dist>0.5){var ux=(x-px)/dist,uy=(y-py)/dist;
      orbs.forEach(function(o){if(!o.alive||o.doomed)return;
        if(segDist(o.x,o.y,px,py,x,y)<o.r*1.05){
          slashes.push({x1:o.x-ux*o.r*1.6,y1:o.y-uy*o.r*1.6,x2:o.x+ux*o.r*1.6,y2:o.y+uy*o.r*1.6,life:0.22,max:0.22});
          explode(o,{power:1.15,dir:{x:ux,y:uy}});}});}
  }
});
function endPointer(e,cancel){
  var p=pointers[e.pointerId];if(!p)return;delete pointers[e.pointerId];
  if(p.mode==='charge'){chargeStop(p);if(!cancel){if(p.c>0.12)mega(p.x,p.y,p.c);else tapEmpty(p.x,p.y);}}
  else if(p.mode==='idle'&&!cancel)tapEmpty(p.x,p.y);
  ghosts.push(p.trail);
}
cv.addEventListener('pointerup',function(e){endPointer(e,false);});
cv.addEventListener('pointercancel',function(e){endPointer(e,true);});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
var muteBtn=document.getElementById('mute');
function drawMute(){['w1','w2'].forEach(function(id){document.getElementById(id).style.display=muted?'none':'';});document.getElementById('x1').style.display=muted?'':'none';}
drawMute();
muteBtn.addEventListener('click',function(){muted=!muted;ensureAudio();if(master)master.gain.value=muted?0:0.75;
  try{localStorage.setItem('smash_muted',muted?'1':'0');}catch(e){}drawMute();});
document.addEventListener('visibilitychange',function(){if(document.hidden){for(var k in pointers){chargeStop(pointers[k]);delete pointers[k];}}});

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  for(var i=events.length-1;i>=0;i--){if(events[i].t<=T){var ev=events.splice(i,1)[0];ev.fn();}}
  while(orbs.length+pending<target()){pending++;at(T+rand(0.12,0.7)+pending*0.04,spawnOrb);}
  var k;
  for(k in pointers){var p=pointers[k];
    if(p.mode==='idle'&&T-p.t0>0.22){p.mode='charge';p.cs=T;chargeStart(p);}
    if(p.mode==='charge'){
      p.c=Math.min(1,(T-p.cs)/1.3);chargeUpd(p,p.c);
      if(T-p.lv>0.12){vib(Math.round(8+p.c*22));p.lv=T;}
      var n=2+Math.round(p.c*5);
      for(var j=0;j<n;j++){var a=rand(0,TAU),rr=(60+p.c*110)*SCALE*rand(1,1.8),L=0.32;
        glows.push({x:p.x+Math.cos(a)*rr,y:p.y+Math.sin(a)*rr,vx:-Math.cos(a)*rr/L,vy:-Math.sin(a)*rr/L,life:L,max:L,s:rand(3,7)*SCALE,hi:p.c>=1?-1:ri(HUES.length),drag:0});}
      var G=(260+320*p.c)*SCALE;
      orbs.forEach(function(o){var dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1;if(d<G&&d>o.r){var f=600*p.c*SCALE*dt*(1-d/G);o.vx+=dx/d*f;o.vy+=dy/d*f;}});
      shake=Math.max(shake,p.c*3);
    }
  }
  orbs.forEach(function(o){
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)*0.8;}else if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)*0.8;}
    if(o.y<o.r){o.y=o.r;o.vy=Math.abs(o.vy)*0.8;}else if(o.y>H-o.r){o.y=H-o.r;o.vy=-Math.abs(o.vy)*0.8;}
    var sp=Math.hypot(o.vx,o.vy);if(sp>o.base){var kk=Math.exp(-2.2*dt);o.vx*=kk;o.vy*=kk;}
    o.ph+=dt*o.ws;
  });
  orbs=orbs.filter(function(o){return o.alive;});
  var g=1500*SCALE;
  for(i=shards.length-1;i>=0;i--){var s=shards[i];s.life-=dt;if(s.life<=0||s.y>H+80){shards[i]=shards[shards.length-1];shards.pop();continue;}
    s.vy+=g*dt;var dr=Math.exp(-0.9*dt);s.vx*=dr;s.vy*=dr;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;
    if(s.y>H-4&&s.vy>0){s.y=H-4;s.vy*=-0.35;s.vx*=0.7;s.vr*=0.6;}}
  for(i=glows.length-1;i>=0;i--){var q=glows[i];q.life-=dt;if(q.life<=0){glows[i]=glows[glows.length-1];glows.pop();continue;}
    if(q.drag){var d2=Math.exp(-q.drag*dt);q.vx*=d2;q.vy*=d2;}q.x+=q.vx*dt;q.y+=q.vy*dt;}
  if(glows.length>1600)glows.splice(0,glows.length-1600);
  if(shards.length>1400)shards.splice(0,shards.length-1400);
  rings=rings.filter(function(r){r.life-=dt;return r.life>0;});
  slashes=slashes.filter(function(r){r.life-=dt;return r.life>0;});
  ghosts=ghosts.filter(function(tr){return tr.length&&T-tr[tr.length-1].t<0.2;});
  for(k in pointers){var tr=pointers[k].trail;while(tr.length>1&&T-tr[0].t>0.2)tr.shift();}
  shake*=Math.exp(-9*dt);if(shake<0.05)shake=0;
  flash*=Math.exp(-6*dt);comboPop*=Math.exp(-10*dt);
  var heat=(T-lastHit<1.6)?Math.min(1,combo/40):0;bgHue=(bgHue+dt*(8+heat*140))%360;
  fadeAcc+=dt;if(fadeAcc>0.4){fadeAcc=0;pctx.globalCompositeOperation='destination-out';pctx.fillStyle='rgba(0,0,0,0.06)';pctx.fillRect(0,0,W,H);pctx.globalCompositeOperation='source-over';}
}

/* ---------- draw ---------- */
function drawTrail(tr){
  if(tr.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';
  for(var pass=0;pass<2;pass++){
    for(var i=1;i<tr.length;i++){var a=tr[i-1],b=tr[i],age=T-b.t;if(age>0.2)continue;var k=1-age/0.2;
      ctx.strokeStyle=pass?'rgba(255,255,255,'+(0.95*k)+')':'hsla('+bgHue+',100%,65%,'+(0.45*k)+')';
      ctx.lineWidth=(pass?7:20)*k*SCALE+1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
}
function draw(){
  var sx=(Math.random()-0.5)*2*shake,sy=(Math.random()-0.5)*2*shake;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#07060d';ctx.fillRect(0,0,W,H);
  var heat=(T-lastHit<1.6)?Math.min(1,combo/40):0;
  var bg=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,Math.max(W,H)*0.85);
  bg.addColorStop(0,'hsla('+bgHue+',80%,32%,'+(0.2+heat*0.3)+')');bg.addColorStop(1,'hsla('+((bgHue+70)%360)+',80%,12%,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.setTransform(1,0,0,1,sx*DPR,sy*DPR);ctx.drawImage(paint,0,0);
  var B=function(){ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);};B();
  var i;
  // orbs
  for(i=0;i<orbs.length;i++){var o=orbs[i],age=T-o.t0,sc=age<0.45?Math.max(0,easeOutBack(age/0.45)):1;
    var w=1+Math.sin(o.ph)*0.035,s=o.r*sc/OR,jx=o.doomed?rand(-2,2):0;
    ctx.setTransform(DPR*s*w,0,0,DPR*s/w,DPR*(o.x+sx+jx),DPR*(o.y+sy));ctx.drawImage(ORB_SPR[o.hi],-OR*2,-OR*2);}
  // shards
  for(i=0;i<shards.length;i++){var sh=shards[i],c=Math.cos(sh.rot),sn=Math.sin(sh.rot),z=sh.s;
    ctx.globalAlpha=Math.min(1,sh.life/sh.max*1.8);ctx.fillStyle=sh.c;
    ctx.setTransform(DPR*c,DPR*sn,-DPR*sn,DPR*c,DPR*(sh.x+sx),DPR*(sh.y+sy));
    ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(-z*0.6,z*0.7);ctx.lineTo(-z*0.5,-z*0.6);ctx.closePath();ctx.fill();}
  ctx.globalAlpha=1;B();
  ctx.globalCompositeOperation='lighter';
  // rings
  rings.forEach(function(r){var t=1-r.life/r.max,e=1-Math.pow(1-t,3),rad=r.r0+(r.r1-r.r0)*e;
    ctx.strokeStyle=r.h<0?'rgba(255,255,255,'+(1-t)+')':'hsla('+r.h+',100%,72%,'+(1-t)+')';
    ctx.lineWidth=r.w*(1-t)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke();});
  // glows
  for(i=0;i<glows.length;i++){var q=glows[i];ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.drawImage(q.hi<0?WHITE:GLOW_SPR[q.hi],q.x-q.s,q.y-q.s,q.s*2,q.s*2);}
  ctx.globalAlpha=1;
  // slashes
  ctx.lineCap='round';
  slashes.forEach(function(l){var k=l.life/l.max;ctx.strokeStyle='rgba(255,255,255,'+k+')';ctx.lineWidth=9*k*SCALE+1;
    ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();});
  // trails
  ghosts.forEach(drawTrail);
  var k;for(k in pointers){var p=pointers[k];if(p.mode!=='charge')drawTrail(p.trail);}
  // charge
  for(k in pointers){var pc=pointers[k];if(pc.mode!=='charge')continue;var cc=pc.c,full=cc>=1,pulse=full?1+Math.sin(T*30)*0.12:1;
    var cs=(24+cc*70)*SCALE*pulse;ctx.drawImage(WHITE,pc.x-cs,pc.y-cs,cs*2,cs*2);
    var rr=(38+cc*44)*SCALE*pulse;
    ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=5*SCALE;ctx.beginPath();ctx.arc(pc.x,pc.y,rr,0,TAU);ctx.stroke();
    ctx.strokeStyle=full?'rgba(255,255,255,0.95)':'hsla('+bgHue+',100%,72%,0.95)';ctx.lineWidth=5*SCALE;
    ctx.beginPath();ctx.arc(pc.x,pc.y,rr,-Math.PI/2,-Math.PI/2+TAU*cc);ctx.stroke();}
  ctx.globalCompositeOperation='source-over';
  // combo
  ctx.setTransform(DPR,0,0,DPR,sx*DPR*0.5,sy*DPR*0.5);ctx.textAlign='center';ctx.textBaseline='middle';
  var since=T-lastHit;
  if(combo>=3&&since<1.6){var al=Math.min(1,(1.6-since)/0.4),sc2=1+comboPop*0.45,fs=Math.round(64*SCALE*sc2);
    ctx.globalAlpha=al;ctx.fillStyle='hsl('+((combo*23)%360)+',100%,72%)';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=24;
    ctx.font='900 '+fs+'px system-ui,-apple-system,sans-serif';ctx.fillText(combo,W/2,H*0.24);
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='800 '+Math.round(14*SCALE)+'px system-ui,sans-serif';
    ctx.fillText('C O M B O',W/2,H*0.24+fs*0.62);ctx.globalAlpha=1;}
  if(banner){var bt=T-banner.t0;if(bt>1.3)banner=null;else{
    var bs=bt<0.25?easeOutBack(bt/0.25):1,ba=bt>0.9?1-(bt-0.9)/0.4:1;
    ctx.globalAlpha=Math.max(0,ba);ctx.fillStyle='hsl('+banner.h+',100%,75%)';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=30;
    ctx.font='900 italic '+Math.round(56*SCALE*bs)+'px system-ui,sans-serif';ctx.fillText(banner.text,W/2,H*0.42);
    ctx.shadowBlur=0;ctx.globalAlpha=1;}}
  if(flash>0.01){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(255,250,240,'+flash+')';ctx.fillRect(0,0,W,H);}
}

var last=performance.now();
function frame(now){var dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
